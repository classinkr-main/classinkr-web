<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 신입 메이드의 비밀 경쟁</title>
<meta name="description" content="22초 손그림 2D 셀 애니메이션 스타일 로맨틱 코미디. 서로 질투하며 투닥거리던 두 신입 메이드가 처음으로 마음을 여는 이야기. 모든 그림·음악·효과음은 이 파일 안에서 실시간으로 그려지고 합성됩니다.">
<style>
  :root { --bg: #0d0a08; --ink: #f4ead6; --muted: #bfae92; --accent: #f2b46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #cv { width: min(100vw, calc(100vh * 1.8497)); height: auto; aspect-ratio: 1920 / 1038; display: block; background: #000; box-shadow: 0 0 80px rgba(0,0,0,.6); }
  #cover { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(10,8,6,.15), rgba(10,8,6,.72)); transition: opacity .6s; text-align: center; padding: 16px; }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover > div { padding: 34px 56px 30px; border-radius: 28px; background: radial-gradient(ellipse at center, rgba(12,9,7,.62) 0%, rgba(12,9,7,.38) 55%, rgba(12,9,7,0) 78%); }
  #cover h1 { margin: 0; font-size: clamp(28px, 4.6vw, 64px); line-height: 1.18; letter-spacing: .05em; font-weight: 700; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  #cover .en { margin: 6px 0 18px; font-size: clamp(13px, 1.6vw, 18px); letter-spacing: .4em; color: #e6d6b8; text-shadow: 0 1px 10px rgba(0,0,0,.8); text-transform: uppercase; }
  #go { font: inherit; font-size: clamp(16px, 2vw, 21px); padding: 12px 30px; border-radius: 999px; border: 1px solid rgba(244,234,214,.5); background: rgba(242,180,106,.18); color: var(--ink); cursor: pointer; backdrop-filter: blur(4px); }
  #go:hover:not(:disabled) { background: rgba(242,180,106,.35); }
  #go:disabled { opacity: .55; cursor: progress; }
  #status { margin-top: 12px; font-size: 14px; color: #e6d6b8; min-height: 1.2em; text-shadow: 0 1px 8px rgba(0,0,0,.85); }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 12px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: opacity .35s; }
  body.ui-on #ui, body:not(.playing) #ui { opacity: 1; }
  body.still #ui, body.still #cover { display: none; }
  #ui button { font: inherit; width: 40px; height: 36px; border-radius: 8px; border: 0; background: rgba(255,255,255,.12); color: var(--ink); cursor: pointer; font-size: 15px; }
  #ui button:hover { background: rgba(255,255,255,.24); }
  #bar { flex: 1; accent-color: var(--accent); min-width: 60px; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 92px; text-align: right; }
  @media (max-width: 520px) { #time { display: none; } #ui { gap: 6px; padding: 8px 10px; } }
</style>
</head>
<body class="ui-on">
<div id="stage">
  <canvas id="cv" width="2560" height="1384" aria-label="애니메이션 화면"></canvas>
  <div id="cover">
    <div>
      <h1>두 신입 메이드의<br>비밀 경쟁</h1>
      <div class="en">The Secret Rivalry</div>
      <button id="go" disabled>준비 중…</button>
      <div id="status">준비 중…</div>
    </div>
  </div>
  <div id="ui">
    <button id="pp" aria-label="재생">▶</button>
    <button id="rs" aria-label="처음부터">↺</button>
    <input id="bar" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
    <span id="time">0:00.0 / 0:22.0</span>
    <button id="mu" aria-label="소리 켜기/끄기">🔊</button>
    <button id="fs" aria-label="전체 화면">⛶</button>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   CORE — constants, math, easing, noise, path helpers
   ============================================================ */
const W = 1920, H = 1038, FPS = 24, DUR = 22;
const RS = 4 / 3; // supersampled render scale (canvas = 2560 x 1384)
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const E = {
  lin: t => t,
  i2: t => t * t,
  o2: t => 1 - (1 - t) * (1 - t),
  io2: t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t)),
  i3: t => t * t * t,
  o3: t => 1 - Math.pow(1 - t, 3),
  io3: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  o4: t => 1 - Math.pow(1 - t, 4),
  o5: t => 1 - Math.pow(1 - t, 5),
  i4: t => t * t * t * t,
  ob: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  ob2: t => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  sm: t => t * t * (3 - 2 * t),
  step: t => (t < 1 ? 0 : 1),
  hold: t => 0,
};
/* Keyframes:  K(t, [[t0,v0],[t1,v1,'o3'],...])  — ease named at the destination key */
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i];
    if (t <= k[0]) {
      const p = keys[i - 1];
      const d = k[0] - p[0];
      const u = d > 0 ? (t - p[0]) / d : 1;
      return lerp(p[1], k[1], E[k[2] || 'io2'](u));
    }
  }
  return keys[keys.length - 1][1];
}
/* Discrete keys (for mouth shapes etc.) */
function D(t, keys) {
  let v = keys[0][1];
  for (const k of keys) if (t >= k[0]) v = k[1];
  return v;
}
/* Pulse 0→1→0 between a..b with ramps r */
function pulse(t, a, b, r1, r2) {
  r2 = r2 === undefined ? r1 : r2;
  if (t < a || t > b) return 0;
  return Math.min(1, (t - a) / r1, (b - t) / r2);
}

/* ---------- random / noise ---------- */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(i, j) {
  let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, seed) {
  const i = Math.floor(x), f = x - i;
  const a = hash2(i, seed || 0), b = hash2(i + 1, seed || 0);
  return a + (b - a) * f * f * (3 - 2 * f);
}
/* signed smooth noise -1..1 */
const sn = (x, s) => vnoise(x, s) * 2 - 1;

/* ---------- color ---------- */
function hexRgb(h) {
  if (h[0] === '#') h = h.slice(1);
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgba = (r, g, b, a) => `rgba(${r | 0},${g | 0},${b | 0},${a === undefined ? 1 : a})`;
function mixc(h1, h2, t, a) {
  const A = hexRgb(h1), B = hexRgb(h2);
  return rgba(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t), a);
}
function alpha(h, a) { const c = hexRgb(h); return rgba(c[0], c[1], c[2], a); }
function jit(h, rnd, amt, a) {
  const c = hexRgb(h);
  const d = (rnd() - 0.5) * 2 * amt;
  const e = (rnd() - 0.5) * amt;
  return rgba(clamp(c[0] + d + e, 0, 255), clamp(c[1] + d, 0, 255), clamp(c[2] + d - e, 0, 255), a);
}

/* ---------- boil (hand-drawn line wobble) ---------- */
const BOIL = { seed: 1, amp: 0.4, n: 0, on: true };
function boilReset(seed, amp) { BOIL.seed = seed; BOIL.n = 0; if (amp !== undefined) BOIL.amp = amp; }
function bpt(p) {
  if (!BOIL.on || BOIL.amp === 0) return p;
  const n = BOIL.n++;
  const a = BOIL.amp;
  const q = [p[0] + (hash2(n, BOIL.seed) - 0.5) * 2 * a, p[1] + (hash2(n, BOIL.seed + 7919) - 0.5) * 2 * a];
  if (p[2]) q[2] = p[2];
  return q;
}

/* ---------- curve helpers ---------- */
/* Catmull-Rom → bezier into a Path2D. p[2]===1 marks a sharp corner. */
function crInto(path, pts, closed, move) {
  const n = pts.length;
  if (n < 2) return path;
  const P = i => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  if (move !== false) path.moveTo(pts[0][0], pts[0][1]);
  else path.lineTo(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    let c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    let c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    if (p1[2] === 1) { c1x = p1[0] + (p2[0] - p1[0]) / 3; c1y = p1[1] + (p2[1] - p1[1]) / 3; }
    if (p2[2] === 1) { c2x = p2[0] - (p2[0] - p1[0]) / 3; c2y = p2[1] - (p2[1] - p1[1]) / 3; }
    path.bezierCurveTo(c1x, c1y, c2x, c2y, p2[0], p2[1]);
  }
  if (closed) path.closePath();
  return path;
}
/* boiled smooth shape */
function shp(pts, closed) {
  const q = pts.map(bpt);
  return crInto(new Path2D(), q, closed !== false);
}
function shpRaw(pts, closed) { return crInto(new Path2D(), pts, closed !== false); }
/* sample a CR spline to polyline */
function sampleCR(pts, per, closed) {
  const out = [];
  const n = pts.length;
  if (n < 2) return pts.slice();
  const P = i => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let s = 0; s < per; s++) {
      const t = s / per, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice(0, 2));
  return out;
}
/* tapered brush stroke along CR spline. wf(u) gives width multiplier */
function taper(pts, w, wf, per) {
  const q = pts.map(bpt);
  const poly = sampleCR(q, per || 6, false);
  const n = poly.length;
  if (n < 2) return new Path2D();
  const L = [0];
  for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
  const tot = L[n - 1] || 1;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const a = poly[Math.max(0, i - 1)], b = poly[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const u = L[i] / tot;
    const ww = w * (wf ? wf(u) : Math.pow(Math.sin(PI * clamp(u, 0.02, 0.98)), 0.55)) * 0.5;
    left.push([poly[i][0] - dy * ww, poly[i][1] + dx * ww]);
    right.push([poly[i][0] + dy * ww, poly[i][1] - dx * ww]);
  }
  const p = new Path2D();
  p.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(left[i][0], left[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(right[i][0], right[i][1]);
  p.closePath();
  return p;
}
const WF = {
  both: u => Math.pow(Math.sin(PI * clamp(u, 0.03, 0.97)), 0.5),
  tail: u => Math.pow(1 - u, 0.7) * Math.min(1, u * 8 + 0.35),
  head: u => Math.pow(u, 0.7) * Math.min(1, (1 - u) * 8 + 0.35),
  lash: u => (0.35 + 0.65 * Math.pow(u, 0.8)) * Math.min(1, (1 - u) * 7 + 0.2),
  flat: u => Math.min(1, u * 10 + 0.3, (1 - u) * 10 + 0.3),
};

/* ---------- cel painting helper ----------
   Global light from upper-left (window side). Shadow falls lower-right. */
const LIGHT = { x: -1, y: -0.75 };
function cel(ctx, path, o) {
  ctx.fillStyle = o.base;
  ctx.fill(path);
  if (o.shade) {
    ctx.save();
    ctx.clip(path);
    ctx.fillStyle = o.shade;
    ctx.fill(path);
    const k = o.off === undefined ? 8 : o.off;
    ctx.translate(LIGHT.x * k * (o.kx || 1), LIGHT.y * k * (o.ky || 1));
    ctx.fillStyle = o.base;
    ctx.fill(path);
    ctx.restore();
  }
  if (o.rim) {
    const r = o.rimW || 3;
    ctx.save();
    ctx.clip(path);
    const p = new Path2D();
    p.rect(-1e5, -1e5, 2e5, 2e5);
    p.addPath(path, { a: 1, b: 0, c: 0, d: 1, e: -LIGHT.x * r, f: -LIGHT.y * r });
    ctx.clip(p, 'evenodd');
    ctx.fillStyle = o.rim;
    ctx.fill(path);
    ctx.restore();
  }
  if (o.after) { ctx.save(); ctx.clip(path); o.after(ctx); ctx.restore(); }
  if (o.line) {
    ctx.strokeStyle = o.line;
    ctx.lineWidth = o.lw;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke(path);
  }
}
function strokeP(ctx, path, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(path);
}
function fillP(ctx, path, col) { ctx.fillStyle = col; ctx.fill(path); }

/* 2-bone IK. returns elbow point. bend: +1 / -1 chooses side */
function ik(sx, sy, tx, ty, L1, L2, bend) {
  let dx = tx - sx, dy = ty - sy;
  let d = Math.hypot(dx, dy);
  const maxd = (L1 + L2) * 0.999;
  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }
  if (d < 1e-3) d = 1e-3;
  const a = Math.atan2(dy, dx);
  const c = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const b = Math.acos(c) * (bend >= 0 ? 1 : -1);
  return [sx + Math.cos(a + b) * L1, sy + Math.sin(a + b) * L1, sx + dx, sy + dy];
}
function rot(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* simple 4-point sparkle star */
function starPath(x, y, r, thin) {
  const p = new Path2D();
  const t = r * (thin || 0.18);
  p.moveTo(x, y - r);
  p.quadraticCurveTo(x + t, y - t, x + r, y);
  p.quadraticCurveTo(x + t, y + t, x, y + r);
  p.quadraticCurveTo(x - t, y + t, x - r, y);
  p.quadraticCurveTo(x - t, y - t, x, y - r);
  p.closePath();
  return p;
}

/* ============================================================
   BACKGROUNDS — procedural gouache paintings
   P1: corridor wall elevation (world x 0..4200, y -400..1400)
   P2: one-point perspective down the corridor (final shot)
   ============================================================ */
const BG = {};
const P1OY = 400;
const DOOR = { x0: 3290, x1: 3610, top: 0, cx: 3450, bellX: 3450, bellY: -112 };
const WINS = [[140, 520], [1210, 1610], [2410, 2810], [3800, 4160]];
const RUG = { y0: 880, y1: 1072, seam: 2966 };

function dabs(g, R, x, y, w, h, cols, n, r0, r1, a0, a1, sx, sy, rotJ) {
  sx = sx || 1; sy = sy || 1;
  for (let i = 0; i < n; i++) {
    const px = x + R() * w, py = y + R() * h, r = lerp(r0, r1, R());
    g.fillStyle = jit(cols[(R() * cols.length) | 0], R, 12, lerp(a0, a1, R()));
    g.beginPath();
    g.ellipse(px, py, r * sx, r * sy, (R() - 0.5) * (rotJ === undefined ? 0.8 : rotJ), 0, TAU);
    g.fill();
  }
}
function strokesR(g, R, x, y, w, h, cols, n, l0, l1, wid, ang, angJ, a0, a1) {
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const px = x + R() * w, py = y + R() * h, L = lerp(l0, l1, R());
    const an = ang + (R() - 0.5) * angJ;
    const ex = px + Math.cos(an) * L, ey = py + Math.sin(an) * L;
    g.strokeStyle = jit(cols[(R() * cols.length) | 0], R, 10, lerp(a0, a1, R()));
    g.lineWidth = wid * (0.5 + R());
    g.beginPath();
    g.moveTo(px, py);
    g.quadraticCurveTo((px + ex) / 2 + (R() - 0.5) * L * 0.2, (py + ey) / 2 + (R() - 0.5) * L * 0.2, ex, ey);
    g.stroke();
  }
}
function hline(g, R, x0, y0, x1, y1, col, lw, wob) {
  const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 40));
  g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = lerp(x0, x1, t) + (i && i < n ? (R() - 0.5) * wob : 0);
    const y = lerp(y0, y1, t) + (i && i < n ? (R() - 0.5) * wob : 0);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
}
function poly(g, pts, col) {
  g.fillStyle = col; g.beginPath();
  pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
  g.closePath(); g.fill();
}
function rectG(g, x, y, w, h, c0, c1, vertical) {
  const gr = vertical === false ? g.createLinearGradient(x, 0, x + w, 0) : g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fillRect(x, y, w, h);
}
function archPath(x0, x1, yT, yB) {
  const r = (x1 - x0) / 2, cx = (x0 + x1) / 2;
  const p = new Path2D();
  p.moveTo(x0, yB); p.lineTo(x0, yT); p.arc(cx, yT, r, PI, 0); p.lineTo(x1, yB); p.closePath();
  return p;
}

/* ---------------- outside garden view ---------------- */
function paintOutside(g, R, x0, y0, w, h) {
  const sky = g.createLinearGradient(0, y0, 0, y0 + h);
  sky.addColorStop(0, '#a9cbe0'); sky.addColorStop(0.45, '#d9e8e6'); sky.addColorStop(0.75, '#fbf1d2'); sky.addColorStop(1, '#fff6dc');
  g.fillStyle = sky; g.fillRect(x0, y0, w, h);
  // clouds
  dabs(g, R, x0, y0 + h * 0.05, w, h * 0.25, ['#f6f4ea', '#ffffff', '#e8eef0'], 40, 14, 42, 0.18, 0.4, 1.8, 0.7, 0.2);
  // far tree line
  for (let i = 0; i < 70; i++) {
    const px = x0 + R() * w, py = y0 + h * (0.5 + R() * 0.12);
    g.fillStyle = jit(R() < 0.5 ? '#9fbbad' : '#b4c9b7', R, 10, 0.55);
    g.beginPath(); g.ellipse(px, py, 20 + R() * 30, 16 + R() * 26, 0, 0, TAU); g.fill();
  }
  // mid trees (sunlit clumps)
  for (let i = 0; i < 160; i++) {

/* ---------------- arched window with curtains (P1) ---------------- */
function paintWindowP1(g, R, x0, x1) {
  const yT = -110, yB = 462, w = x1 - x0, cx = (x0 + x1) / 2, r = w / 2;
  // outer moulding glow on wall
  g.save();
  g.globalCompositeOperation = 'screen';
  const glow = g.createRadialGradient(cx, yB - 80, 40, cx, yB - 80, w * 1.25);
  glow.addColorStop(0, 'rgba(255,226,170,0.42)'); glow.addColorStop(1, 'rgba(255,220,160,0)');
  g.fillStyle = glow; g.fillRect(x0 - w, yT - r - 200, w * 3, yB - yT + r + 520);
  g.restore();
  // architrave
  const outer = archPath(x0 - 26, x1 + 26, yT, yB + 4);
  g.fillStyle = '#8a613c'; g.fill(outer);
  g.strokeStyle = '#5a3a20'; g.lineWidth = 3; g.stroke(outer);
  const mid = archPath(x0 - 14, x1 + 14, yT, yB + 4);
  g.fillStyle = '#b07f4f'; g.fill(mid);
  // opening with garden
  const op = archPath(x0, x1, yT, yB);
  g.save(); g.clip(op);
  paintOutside(g, R, x0, yT - r, w, yB - yT + r);
  // glass reflections
  g.globalCompositeOperation = 'screen';
  for (let i = 0; i < 4; i++) {
    const sx = x0 + R() * w;
    g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 18 + R() * 30;
    g.beginPath(); g.moveTo(sx, yB); g.lineTo(sx + 160, yT - r); g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
  // mullions (backlit, dark warm wood with gold edge)
  const bar = (ax, ay, bx, by, lw) => {
    hline(g, R, ax, ay, bx, by, '#4d321e', lw, 0.6);
    hline(g, R, ax - 2, ay, bx - 2, by, 'rgba(255,214,150,0.55)', 1.6, 0.4);
  };
  for (let k = 1; k < 3; k++) bar(x0 + (w * k) / 3, yB, x0 + (w * k) / 3, yT - Math.sqrt(Math.max(0, r * r - Math.pow((w * k) / 3 - r, 2))), 7);
  for (let y = yB - 98; y > yT - 10; y -= 98) bar(x0, y, x1, y, 6);
  // arch tracery
  for (let k = 1; k < 6; k++) {
    const a = PI + (PI * k) / 6;
    bar(cx, yT, cx + Math.cos(a) * r, yT + Math.sin(a) * r, 5);
  }
  g.strokeStyle = '#4d321e'; g.lineWidth = 7;
  g.beginPath(); g.arc(cx, yT, r * 0.38, PI, 0); g.stroke();
  g.restore();
  // inner frame line
  g.strokeStyle = '#3e2816'; g.lineWidth = 5; g.stroke(op);
  // sill
  rectG(g, x0 - 36, yB, w + 72, 16, '#e7c89a', '#a87a4a');
  rectG(g, x0 - 36, yB + 16, w + 72, 9, '#6e4a2c', '#4a2f19');
  // curtains
  paintCurtain(g, R, x0, -1);
  paintCurtain(g, R, x1, 1);
  // pelmet
  rectG(g, x0 - 110, -380, w + 220, 44, '#6d4628', '#4b2e18');
  hline(g, R, x0 - 110, -338, x1 + 110, -338, '#c79a5f', 3, 1);
}
function paintCurtain(g, R, edge, side) {
  // side -1: curtain on left of window (edge = x0), +1 right (edge = x1)
  const s = side;
  const top = -340, tie = 236, bot = 742;
  const innerTop = edge + s * -40, outerTop = edge + s * 96;
  const innerTie = edge + s * 46, outerTie = edge + s * 92;
  const innerBot = edge + s * 18, outerBot = edge + s * 112;
  const p = new Path2D();
  p.moveTo(innerTop, top);
  p.bezierCurveTo(innerTop, top + 200, innerTie - s * 30, tie - 120, innerTie, tie);
  p.bezierCurveTo(innerTie + s * 2, tie + 140, innerBot - s * 10, bot - 200, innerBot, bot);
  p.lineTo(outerBot, bot);
  p.bezierCurveTo(outerBot, bot - 220, outerTie + s * 6, tie + 150, outerTie, tie);
  p.bezierCurveTo(outerTie + s * 4, tie - 160, outerTop, top + 200, outerTop, top);
  p.closePath();
  g.fillStyle = '#56796f'; g.fill(p);
  g.save(); g.clip(p);
  // folds
  for (let i = 0; i < 9; i++) {
    const u = i / 8;
    const xt = lerp(innerTop, outerTop, u), xm = lerp(innerTie, outerTie, u), xb = lerp(innerBot, outerBot, u);
    g.strokeStyle = i % 2 ? 'rgba(40,66,60,0.55)' : 'rgba(140,178,160,0.45)';
    g.lineWidth = 10 + R() * 8;
    g.beginPath(); g.moveTo(xt, top); g.quadraticCurveTo(xt, tie - 100, xm, tie); g.quadraticCurveTo(xm, tie + 120, xb, bot); g.stroke();
  }
  dabs(g, R, Math.min(innerBot, outerTop) - 60, top, 260, bot - top, ['#4b6b62', '#6a8f83'], 120, 6, 16, 0.12, 0.25, 0.5, 2.2, 0.1);
  // backlit rim near the glass
  const rim = g.createLinearGradient(edge - s * 10, 0, edge + s * 70, 0);
  rim.addColorStop(0, 'rgba(255,226,160,0.75)'); rim.addColorStop(1, 'rgba(255,226,160,0)');
  g.fillStyle = rim; g.fillRect(Math.min(edge - s * 60, edge + s * 140), top, 200, bot - top);
  g.restore();
  g.strokeStyle = 'rgba(40,52,46,0.8)'; g.lineWidth = 2.5; g.stroke(p);
  // tie-back cord + tassel
  g.strokeStyle = '#b8873b'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(innerTie - s * 4, tie - 8); g.quadraticCurveTo((innerTie + outerTie) / 2, tie + 12, outerTie + s * 10, tie - 4); g.stroke();
  g.fillStyle = '#c99a45';
  g.beginPath(); g.ellipse(outerTie + s * 12, tie + 18, 7, 18, 0, 0, TAU); g.fill();
  g.strokeStyle = '#7a5520'; g.lineWidth = 1.5; g.stroke();
}

/* flowers in a vase */
function paintBouquet(g, R, cx, by, w, h, palette) {
  // greenery
  for (let i = 0; i < 46; i++) {
    const a = -PI / 2 + (R() - 0.5) * 2.6, d = (0.25 + R() * 0.75) * h * 0.8;
    const lx = cx + Math.cos(a) * d * (w / h) * 0.95, ly = by - h * 0.18 + Math.sin(a) * d * 0.85;
    g.fillStyle = jit(['#4d6f3e', '#5f8248', '#3f5e36', '#7a9a52'][(R() * 4) | 0], R, 10, 0.92);
    g.save(); g.translate(lx, ly); g.rotate(a + (R() - 0.5) * 0.8);
    g.beginPath(); g.moveTo(-10, 0); g.quadraticCurveTo(0, -7, 12, 0); g.quadraticCurveTo(0, 7, -10, 0); g.fill();
    g.restore();
  }
  for (let i = 0; i < 22; i++) {
    const a = -PI / 2 + (R() - 0.5) * 2.2, d = R() * h * 0.75;
    const fx = cx + Math.cos(a) * d * (w / h) * 0.9, fy = by - h * 0.25 + Math.sin(a) * d * 0.8;
    const col = palette[(R() * palette.length) | 0];
    const rr = 7 + R() * 9;
    for (let k = 0; k < 6; k++) {
      g.fillStyle = jit(col, R, 16, 0.9);
      g.beginPath(); g.ellipse(fx + (R() - 0.5) * rr, fy + (R() - 0.5) * rr, rr * 0.6, rr * 0.5, R() * 3, 0, TAU); g.fill();
    }
    g.fillStyle = 'rgba(255,250,230,0.5)';
    g.beginPath(); g.ellipse(fx - rr * 0.3, fy - rr * 0.3, rr * 0.3, rr * 0.2, 0, 0, TAU); g.fill();
  }
}
function paintVase(g, R, cx, by, w, h, col, colS) {
  const p = new Path2D();
  p.moveTo(cx - w * 0.22, by - h);
  p.bezierCurveTo(cx - w * 0.2, by - h * 0.7, cx - w * 0.55, by - h * 0.55, cx - w * 0.5, by - h * 0.25);
  p.bezierCurveTo(cx - w * 0.45, by - h * 0.05, cx - w * 0.25, by, cx, by);
  p.bezierCurveTo(cx + w * 0.25, by, cx + w * 0.45, by - h * 0.05, cx + w * 0.5, by - h * 0.25);
  p.bezierCurveTo(cx + w * 0.55, by - h * 0.55, cx + w * 0.2, by - h * 0.7, cx + w * 0.22, by - h);
  p.closePath();
  g.fillStyle = col; g.fill(p);
  g.save(); g.clip(p);
  g.fillStyle = colS; g.beginPath(); g.ellipse(cx + w * 0.38, by - h * 0.3, w * 0.35, h * 0.6, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(40,70,140,0.55)'; g.lineWidth = 3;
  for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(cx + (i - 2) * w * 0.18, by - h * 0.4, w * 0.06, h * 0.12, 0.3, 0, TAU); g.stroke(); }
  g.fillStyle = 'rgba(255,255,240,0.7)'; g.beginPath(); g.ellipse(cx - w * 0.28, by - h * 0.42, w * 0.06, h * 0.18, 0.2, 0, TAU); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(50,50,70,0.7)'; g.lineWidth = 2; g.stroke(p);
}

function blurCopy(src, div, px) {
  const w = Math.round(src.width / div), h = Math.round(src.height / div);
  const out = mk(w, h), o = out.getContext('2d');
  if ('filter' in o) {
    o.filter = `blur(${px}px)`;
    o.drawImage(src, 0, 0, w, h);
    o.filter = 'none';
  } else {
    const t = mk(Math.round(w / 3), Math.round(h / 3));
    t.getContext('2d').drawImage(src, 0, 0, t.width, t.height);
    o.imageSmoothingQuality = 'high';
    o.drawImage(t, 0, 0, w, h);
  }
  return out;
}
function paperGrain(g, R, x, y, w, h, n) {
  for (let i = 0; i < n; i++) {
    const px = x + R() * w, py = y + R() * h;
    g.fillStyle = R() < 0.5 ? 'rgba(255,248,230,0.06)' : 'rgba(60,40,20,0.06)';
    g.fillRect(px, py, 2 + R() * 3, 1 + R() * 2);
  }
}

/* ---------- skeleton ---------- */
function skeleton(D, P) {
  const phi = clamp(P.yaw, -1, 1) * 0.95;

  const hipX = P.hipX || 0, hipY = -335 + (P.bob || 0) + (P.kneel || 0) * 190;
  const lean = P.lean || 0;
  const T = (x, y) => { const r = rot(x, y, lean); return [hipX + r[0], hipY + r[1]]; };
  const hw = (w, d) => Math.sqrt(w * w * c * c + d * d * sp * sp);
  const S = { phi, c, sp, T, hw, lean, hipX, hipY };
  S.shL = T(-D.sw * 0.82 * c, -184);
  S.shR = T(D.sw * 0.82 * c, -184);
  S.zL = D.sw * sp; S.zR = -D.sw * sp;
  S.neck = T(0, -203);
  const H = P.head;
  const nk = rot(0, -77, lean * 0.7 + H.tilt * 0.25);
  S.head = [S.neck[0] + nk[0] + H.dx, S.neck[1] + nk[1] + H.dy];
  S.headRot = lean * 0.55 + H.tilt;
  // arms
  const arm = (A, sh, bend) => {
    let tx = A.x, ty = A.y;
    if (A.w) { tx = (A.x - P.x) / (P.s * D.scale); ty = (A.y - P.y) / (P.s * D.scale); }
    const b0 = A.bend !== undefined ? A.bend : bend;
    let e = ik(sh[0], sh[1], tx, ty, D.L1, D.L2, b0);
    if (ty < sh[1] - 10 && !A.fixBend) {
      // raised hand: keep the elbow on the outside, never across the face/body
      const e2 = ik(sh[0], sh[1], tx, ty, D.L1, D.L2, -b0);
      const cx = S.neck[0], out = Math.sign(sh[0] - cx) || 1;
      if ((e2[0] - cx) * out > (e[0] - cx) * out) e = e2;
    }
    return { s: sh, e: [e[0], e[1]], h: [e[2], e[3]] };
  };
  S.aL = arm(P.armL, S.shL, 1);
  S.aR = arm(P.armR, S.shR, -1);
  // legs / feet
  const L = P.legs;
  const dir = phi >= 0 ? 1 : -1;
  let fL, fR, liftL = 0, liftR = 0;
  if (L.mode === 'walk') {
    const a = TAU * L.phase;
    const st = L.stride;
    const oL = Math.sin(a) * st * 0.5, oR = -oL;
    liftL = Math.max(0, Math.cos(a)) * (L.lift || 16);
    liftR = Math.max(0, -Math.cos(a)) * (L.lift || 16);
    fL = [hipX - L.spread * c + dir * oL * Math.abs(sp) * 1.1, 0 + sp * 6];
    fR = [hipX + L.spread * c + dir * oR * Math.abs(sp) * 1.1, 0 - sp * 6];
  } else {
    fL = [hipX * 0.3 - L.spread * c, sp * 6];
    fR = [hipX * 0.3 + L.spread * c, -sp * 6];
  }
  if (L.footL) fL = L.footL.slice();
  if (L.footR) fR = L.footR.slice();
  S.fL = [fL[0], fL[1] - liftL]; S.fR = [fR[0], fR[1] - liftR];
  return S;
}

/* ---------- main draw ---------- */
function linePx() { return 1.55 * Math.pow(CAM.z, 0.62); }
function drawCharacter(ctx, P) {
  const D = P.D;
  const s = P.s * D.scale;
  const WT = ctx.getTransform();
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.scale(s, s);
  const lw = linePx() / (CAM.z * s);
  boilReset(P.seed * 131 + (D.id === 'V' ? 3 : 7), 0.42 / Math.max(0.6, Math.pow(CAM.z * s, 0.5)));
  const S = skeleton(D, P);
  S.lw = lw; S.WT = WT; S.s = s;
  if (P.shadow) drawContactShadow(ctx, D, P, S);
  const tailBehind = true;
  if (tailBehind) drawTail(ctx, D, P, S, lw);
  drawHairBack(ctx, D, P, S, lw);
  const nearL = S.phi > 0.04, nearR = S.phi < -0.04;
  const farArm = nearL ? 'R' : nearR ? 'L' : null;
  if (farArm && !P['arm' + farArm].front) drawArm(ctx, D, P, S, farArm, lw);
  if (!(P.kneel > 0.5)) drawLegs(ctx, D, P, S, lw);
  drawSkirt(ctx, D, P, S, lw);
  drawApron(ctx, D, P, S, lw);
  drawTorso(ctx, D, P, S, lw);
  drawNeck(ctx, D, P, S, lw);
  drawCollar(ctx, D, P, S, lw);
  drawHead(ctx, D, P, S, lw);

  else order.push(farArm === 'L' ? 'R' : 'L');
  // arms under props
  for (const a of order) if (P['arm' + a].layer !== 'over') drawArm(ctx, D, P, S, a, lw);
  for (const pr of P.props) {
    ctx.save(); ctx.setTransform(WT); pr(ctx, S, P); ctx.restore();
  }
  for (const a of order) if (P['arm' + a].layer === 'over') drawArm(ctx, D, P, S, a, lw);
  if (P.after) { ctx.save(); P.after(ctx, S, lw); ctx.restore(); }
  ctx.restore();

}
/* convert rig-local point to world */
function toWorld(P, p) { const s = P.s * P.D.scale; return [P.x + p[0] * s, P.y + p[1] * s]; }

function drawContactShadow(ctx, D, P, S) {
  ctx.save();
  const a = 0.32 * P.shadow;
  const g = ctx.createRadialGradient(S.hipX * 0.4, 0, 10, S.hipX * 0.4, 0, 150);
  g.addColorStop(0, `rgba(40,20,8,${a})`); g.addColorStop(1, 'rgba(40,20,8,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(S.hipX * 0.4 + 18, 6, 150, 26, 0, 0, TAU); ctx.fill();
  // long cast shadow toward camera-right (light from back-left)
  ctx.fillStyle = `rgba(50,25,10,${0.13 * P.shadow})`;
  ctx.beginPath();
  ctx.moveTo(-70, 0); ctx.lineTo(70, 0); ctx.lineTo(250, 110); ctx.lineTo(120, 118); ctx.closePath();
  ctx.fill();
  ctx.restore();

/* ---------- tail ---------- */
function tailSpine(D, P, S) {
  const t = P.tail;
  const side = Math.abs(P.yaw) > 0.15 ? -Math.sign(P.yaw) : (t.side || D.tailSide);
  const base = S.T(-side * 6 - S.sp * D.depth * 0.6 * (side), -82);
  const isV = D.id === 'V';
  const n = isV ? 8 : 6, seg = isV ? 46 : 40;
  const pts = [base];
  let a = (isV ? 1.0 : 0.15) + t.a;
  let x = base[0], y = base[1];
  for (let i = 0; i < n; i++) {
    const w = t.wag * Math.sin(t.wt * TAU - i * 0.65) * (0.3 + i * 0.1);
    const ang = a + w;
    x += Math.cos(ang) * seg * side; y += Math.sin(ang) * seg;
    pts.push([x, y]);
    a += (isV ? -0.27 : -0.3) + t.curl * (isV ? 1 : 1) - t.lift * 0.05;
  }
  return pts;
}
function drawTail(ctx, D, P, S, lw) {
  const pts = tailSpine(D, P, S);
  const isV = D.id === 'V';
  const t = P.tail;
  const poly = sampleCR(pts, 5, false);
  const n = poly.length;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const a = poly[Math.max(0, i - 1)], b = poly[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    let w;
    if (isV) w = 28 * Math.pow(1 - u, 0.55) + 8;
    else {
      w = (16 + 37 * Math.pow(Math.sin(PI * (0.1 + 0.8 * u)), 0.8)) * (1 + t.fluff * 0.35);
      if (u > 0.9) w *= (1 - u) / 0.1 * 0.55 + 0.45;
    }
    left.push([poly[i][0] - dy * w, poly[i][1] + dx * w, u]);
    right.push([poly[i][0] + dy * w, poly[i][1] - dx * w, u]);
  }
  let outline;
  if (isV) {
    outline = left.filter((_, i) => i % 2 === 0).concat(right.filter((_, i) => i % 2 === 0).reverse());
  } else {
    // fluffy soft lobes along both edges, a few wispy points
    outline = [];
    const amp = [7, 11, 6, 13, 8, 10, 5, 12];
    const tuft = (arr, fwd) => {
      let k = 0;
      for (let i = 0; i < arr.length - 1; i += 3, k++) {
        const j = fwd ? i : arr.length - 1 - i;
        const p = arr[j];
        const ci = Math.min(n - 1, Math.max(0, j));
        const cx = poly[ci][0], cy = poly[ci][1];
        const ox = p[0] - cx, oy = p[1] - cy, ol = Math.hypot(ox, oy) || 1;
        const a = amp[(k + (fwd ? 0 : 3)) % amp.length] * (p[2] > 0.08 && p[2] < 0.95 ? 1 : 0.3);
        const wisp = k % 3 === 2;
        outline.push([p[0] + (ox / ol) * a + (fwd ? 3 : -3) * (wisp ? 1 : 0), p[1] + (oy / ol) * a, wisp ? 1 : 0]);
      }
    };
    tuft(left, true);
    const tip = poly[n - 1];
    const tdx = tip[0] - poly[n - 3][0], tdy = tip[1] - poly[n - 3][1], tl = Math.hypot(tdx, tdy) || 1;
    outline.push([tip[0] + (tdx / tl) * 22, tip[1] + (tdy / tl) * 22, 1]);
    tuft(right, false);
  }
  const path = shp(outline, true);
  cel(ctx, path, { base: D.tail, shade: D.tailS, off: isV ? 9 : 14, rim: RIM, rimW: 3, line: D.tailL, lw });
  if (isV) {
    // belly stripe
    const belly = taper(right.filter((_, i) => i % 3 === 0).map(p => [p[0] * 0.75 + p[0] * 0.25, p[1]]), 10, WF.both);
    ctx.save(); ctx.clip(path); ctx.fillStyle = alpha(D.tailB, 0.55); ctx.fill(belly); ctx.restore();
    // dorsal ridge
    const ridge = left.slice(Math.floor(n * 0.12), Math.floor(n * 0.82)).filter((_, i) => i % 3 === 0);
    if (ridge.length > 2) {
      const rp = [];
      ridge.forEach((p, i) => {
        const q = poly[Math.floor(n * 0.12) + i * 3] || p;
        const ox = p[0] - q[0], oy = p[1] - q[1], ol = Math.hypot(ox, oy) || 1;
        rp.push([p[0] + (ox / ol) * (i % 2 ? 4 : 11), p[1] + (oy / ol) * (i % 2 ? 4 : 11), i % 2 ? 0 : 1]);
      });
      const rpp = shp(rp.concat(ridge.slice().reverse()), true);
      cel(ctx, rpp, { base: D.finS, line: D.tailL, lw: lw * 0.8 });
    }
    // fluke fin
    const tip = poly[n - 1], pre = poly[n - 4];
    const ang = Math.atan2(tip[1] - pre[1], tip[0] - pre[0]);
    ctx.save(); ctx.translate(tip[0], tip[1]); ctx.rotate(ang);
    const f = shp([[-4, 0], [12, -12], [34, -34], [58, -60, 1], [46, -26], [40, -8], [37, 0, 1], [40, 8], [46, 26], [58, 60, 1], [34, 34], [12, 12]], true);
    cel(ctx, f, { base: D.tail, shade: D.tailS, off: 7, rim: RIM, rimW: 3, line: D.tailL, lw });
    for (const k of [-1, 1]) for (const q of [0.55, 0.8]) fillP(ctx, taper([[4, k * 3], [30 * q + 6, k * 30 * q], [56 * q, k * 56 * q]], lw * 1.3, WF.tail), alpha(D.tailS, 0.8));
    ctx.restore();
  } else {
    // flame-like inner fur strokes
    for (let i = 4; i < n - 3; i += 4) {
      const p = poly[i], l = left[i], r = right[i];
      const sp = taper([[lerp(p[0], l[0], 0.5), lerp(p[1], l[1], 0.5)], [lerp(poly[i + 2][0], left[i + 2][0], 0.2), lerp(poly[i + 2][1], left[i + 2][1], 0.2)]], lw * 1.6, WF.tail);
      fillP(ctx, sp, alpha(D.tailS, 0.8));
      const sp2 = taper([[lerp(p[0], r[0], 0.55), lerp(p[1], r[1], 0.55)], [lerp(poly[i + 2][0], right[i + 2][0], 0.25), lerp(poly[i + 2][1], right[i + 2][1], 0.25)]], lw * 1.3, WF.tail);
      fillP(ctx, sp2, alpha(D.tailS, 0.6));
    }
    const tipGlow = poly[n - 2];
    ctx.save(); ctx.clip(path);
    ctx.fillStyle = alpha(D.tailB, 0.7); ctx.beginPath(); ctx.ellipse(tipGlow[0], tipGlow[1], 30, 24, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ---------- hair (back mass) ---------- */
function hairBackPts(D, P, S) {
  const [hx, hy] = S.head;
  const R = HEAD_R;
  const hyaw = clamp(P.head.yaw, -1, 1);
  const off = -Math.sin(hyaw * 0.62) * R * 0.4;
  const vx = P.hair.vx || 0, vy = P.hair.vy || 0, fl = P.hair.float || 0;
  const pts = [];
  if (D.id === 'V') {
    // long wavy hair to the waist
    const len = 300;
    const sw = (k) => vx * k + Math.sin(k * 3 + (P.hair.wv || 0)) * 2;
    const L = [
      [hx + off - R * 1.02, hy - R * 0.55],
      [hx + off - R * 1.22, hy + R * 0.3],
      [hx + off - R * 1.42 + sw(0.25), hy + R * 1.4 - fl * 20],
      [hx + off - R * 1.62 + sw(0.45), hy + len * 0.45 - fl * 40],
      [hx + off - R * 1.5 + sw(0.65), hy + len * 0.68 - fl * 60],
      [hx + off - R * 1.7 + sw(0.85), hy + len * 0.9 - fl * 80, 1],
      [hx + off - R * 1.15 + sw(0.9), hy + len * 0.84 - fl * 80],
      [hx + off - R * 0.9 + sw(1), hy + len + vy - fl * 90, 1],
      [hx + off - R * 0.35 + sw(0.95), hy + len * 0.9 - fl * 80],
      [hx + off + R * 0.1 + sw(1), hy + len * 1.02 + vy - fl * 90, 1],
      [hx + off + R * 0.5 + sw(0.95), hy + len * 0.9 - fl * 80],
      [hx + off + R * 0.95 + sw(1), hy + len * 0.98 + vy - fl * 90, 1],
      [hx + off + R * 1.25 + sw(0.9), hy + len * 0.84 - fl * 80],
      [hx + off + R * 1.72 + sw(0.85), hy + len * 0.88 - fl * 80, 1],
      [hx + off + R * 1.5 + sw(0.65), hy + len * 0.66 - fl * 60],
      [hx + off + R * 1.62 + sw(0.45), hy + len * 0.44 - fl * 40],
      [hx + off + R * 1.42 + sw(0.25), hy + R * 1.4 - fl * 20],
      [hx + off + R * 1.22, hy + R * 0.3],
      [hx + off + R * 1.02, hy - R * 0.55],
      [hx + off, hy - R * 1.12],
    ];
    // flip: hair on one side tossed back (wider, lifted)
    const fl2 = P.hair.flip || 0;
    if (fl2) {
      const sd = P.hair.flipSide || 1;
      for (let i = 0; i < L.length; i++) {
        const p = L[i];
        if ((p[0] - hx) * sd > R * 0.5) {
          const k = clamp((p[1] - hy) / len, 0, 1);
          p[0] += sd * Math.sin(fl2 * PI) * 70 * k;
          p[1] -= Math.sin(fl2 * PI) * 60 * k;
        }
      }
    }
    return L;
  }
  // F: voluminous fluffy shoulder-length hair
  const len = 250 + (P.hair.mess || 0) * 14;
  const sw = (k) => vx * k;
  const mess = P.hair.mess || 0;
  const L = [
    [hx + off - R * 1.08, hy - R * 0.62],
    [hx + off - R * 1.38, hy + R * 0.2, 1],
    [hx + off - R * 1.24, hy + R * 0.45],
    [hx + off - R * 1.62 + sw(0.4) - mess * 14, hy + R * 1.1, 1],
    [hx + off - R * 1.34 + sw(0.5), hy + R * 1.3],
    [hx + off - R * 1.72 + sw(0.8) - mess * 18, hy + len * 0.92 - fl * 40, 1],
    [hx + off - R * 1.15 + sw(0.85), hy + len * 0.82 - fl * 40],
    [hx + off - R * 0.9 + sw(1), hy + len + vy - fl * 50, 1],
    [hx + off - R * 0.3 + sw(0.9), hy + len * 0.86 - fl * 40],
    [hx + off + R * 0.2 + sw(1), hy + len * 1.02 + vy - fl * 50, 1],
    [hx + off + R * 0.6 + sw(0.9), hy + len * 0.86 - fl * 40],
    [hx + off + R * 1.0 + sw(1), hy + len + vy - fl * 50, 1],
    [hx + off + R * 1.2 + sw(0.85), hy + len * 0.8 - fl * 40],
    [hx + off + R * 1.75 + sw(0.8) + mess * 18, hy + len * 0.9 - fl * 40, 1],
    [hx + off + R * 1.36 + sw(0.5), hy + R * 1.3],
    [hx + off + R * 1.64 + sw(0.4) + mess * 14, hy + R * 1.08, 1],
    [hx + off + R * 1.26, hy + R * 0.45],
    [hx + off + R * 1.4, hy + R * 0.18, 1],
    [hx + off + R * 1.08, hy - R * 0.62],
    [hx + off, hy - R * 1.16],
  ];
  return L;
}
function drawHairBack(ctx, D, P, S, lw) {
  const pts = hairBackPts(D, P, S);
  const path = shp(pts, true);
  cel(ctx, path, {
    base: D.hairD, shade: mixc(D.hairD, '#000000', 0.25), off: 12, rim: RIM, rimW: 3.5, line: D.hairL, lw,
    after: g => {
      // strand lines
      const [hx, hy] = S.head;
      for (let i = -3; i <= 3; i++) {
        const x0 = hx + i * 18, l = D.id === 'V' ? 240 : 120;
        fillP(g, taper([[x0, hy + 20], [x0 + i * 8 + (P.hair.vx || 0) * 0.5, hy + l * 0.5], [x0 + i * 14 + (P.hair.vx || 0), hy + l]], lw * 1.3, WF.both), alpha(D.hairL, 0.35));
      }
    },
  });
}

/* ---------- legs & shoes ---------- */
function drawLegs(ctx, D, P, S, lw) {
  const dir = S.phi >= 0 ? 1 : -1;
  const feet = [['L', S.fL, S.zL], ['R', S.fR, S.zR]].sort((a, b) => a[2] - b[2]);
  for (const [k, f] of feet) {
    // ankle / stocking
    const hemY = -44 + (P.skirt.vy || 0);
    const ax = f[0], ay = f[1] - 18;
    if (ay > hemY - 30) {
      const st = shp([[ax - 9, hemY - 10], [ax + 9, hemY - 10], [ax + 8, ay], [ax - 8, ay]], true);
      cel(ctx, st, { base: D.stock, shade: mixc(D.stock, '#000', 0.25), off: 4, line: D.shoeL, lw: lw * 0.8 });
    }
    // shoe
    const sx = f[0], sy = f[1];
    const a = Math.abs(S.sp);
    const len = 22 + a * 18;
    const pts = [
      [sx - dir * len * 0.55, sy - 4], [sx - dir * len * 0.6, sy - 16], [sx - dir * len * 0.1, sy - 22],
      [sx + dir * len * 0.55, sy - 16], [sx + dir * len * 1.0, sy - 8], [sx + dir * len * 0.95, sy], [sx - dir * len * 0.2, sy + 2],
    ];
    const sp = shp(pts, true);
    cel(ctx, sp, { base: D.shoe, shade: D.shoeL, off: 4, rim: 'rgba(255,220,170,0.6)', rimW: 2, line: D.shoeL, lw });
    // strap
    strokeP(ctx, shp([[sx - dir * len * 0.3, sy - 20], [sx + dir * len * 0.1, sy - 17]], false), D.shoeL, lw * 1.2);
  }
}

/* ---------- skirt ---------- */
function drawSkirt(ctx, D, P, S, lw) {
  const { c, sp, T } = S;
  const waist = T(0, -66);
  const hipL = T(-S.hw(D.hipW + 6, D.depth + 8) - 2, -10);
  const hipR = T(S.hw(D.hipW + 6, D.depth + 8) + 2, -10);
  const vx = P.skirt.vx || 0, fl = P.skirt.flare || 0;
  const kn = P.kneel || 0;
  const hem = S.hw(D.hemW * (1 + fl * 0.15 + kn * 0.6), D.hemW * 0.62);
  const hy = lerp(-44, -4, kn) + (P.skirt.vy || 0);
  const fc = D.hemW * 0.62 * sp;
  // walking: hem pushes toward forward foot
  const fmid = (S.fL[0] + S.fR[0]) / 2;
  const hx = S.hipX * 0.6 + vx + (fmid - S.hipX * 0.3) * 0.35;
  const wl = T(-S.hw(D.waistW, D.depth) - 1, -70), wr = T(S.hw(D.waistW, D.depth) + 1, -70);
  const waves = 5;
  const bul = kn * 0.35;
  const pts = [wl, hipL, [lerp(hipL[0], hx - hem, 0.55 + bul) - 6, lerp(hipL[1], hy, 0.55 - bul * 0.6)], [hx - hem, hy - 6, 1]];
  for (let i = 1; i < waves * 2; i++) {
    const u = i / (waves * 2);
    const x = hx - hem + u * hem * 2;
    const arc = Math.sin(u * PI) * 12 + (u - 0.5) * sp * -8;
    const fx = Math.abs(x - (hx + fc * 0.5)) < 30 ? 3 : 0;
    pts.push([x, hy + arc + (i % 2 ? 7 : -1) + fx, i % 2 ? 0 : 1]);
  }
  pts.push([hx + hem, hy - 6, 1], [lerp(hipR[0], hx + hem, 0.55 + bul) + 6, lerp(hipR[1], hy, 0.55 - bul * 0.6)], hipR, wr);
  const path = shp(pts, true);
  cel(ctx, path, {
    base: D.dress, shade: D.dressS, off: 16, rim: RIM, rimW: 3, line: D.dressL, lw,
    after: g => {
      // folds
      for (let i = 0; i < 6; i++) {
        const u = (i + 0.5) / 6;
        const top = T(lerp(-D.hipW * c, D.hipW * c, u) * 0.85, -20);
        const bx = hx - hem + u * hem * 2 + vx * 0.2;
        const fp = taper([top, [lerp(top[0], bx, 0.5), lerp(top[1], hy, 0.5)], [bx, hy + 10]], lw * 2.4, WF.head);
        fillP(g, fp, alpha(D.dressS, i % 2 ? 0.75 : 0.45));
      }
      // hem shadow band
      g.fillStyle = alpha(D.dressS, 0.35);
      g.fillRect(hx - hem - 20, hy - 6, hem * 2 + 40, 30);
    },
  });
  S.skirtHem = { hx, hem, hy };
}

/* ---------- apron ---------- */
function drawApron(ctx, D, P, S, lw) {
  const { c, sp, T } = S;
  const fcW = D.depth * sp;
  const top = T(fcW, -70);
  const tw = 33 * c + 4;
  const H = S.skirtHem;
  const bw = 80 * c + 10;
  const by = lerp(H.hy - 58, -40, P.kneel || 0);
  const bx = H.hx + D.hemW * 0.62 * sp * 0.75;
  const vx = P.skirt.vx || 0;
  const pts = [
    [top[0] - tw, top[1]], [top[0] + tw, top[1]],
    [lerp(top[0] + tw, bx + bw, 0.5) + 6, lerp(top[1], by, 0.5)],
    [bx + bw + vx * 0.15, by, 1], [bx + bw * 0.4, by + 6], [bx - bw * 0.3, by + 4], [bx - bw + vx * 0.15, by - 2, 1],
    [lerp(top[0] - tw, bx - bw, 0.5) - 6, lerp(top[1], by, 0.5)],
  ];
  // ruffle border along sides and hem
  {
    const edge = [[pts[1][0], pts[1][1] + 30], pts[2], pts[3], pts[4], pts[5], pts[6], pts[7], [pts[0][0], pts[0][1] + 30]];
    const poly = sampleCR(edge, 6, false);
    const cxm = (top[0] + bx) / 2, cym = (top[1] + by) / 2;
    const fr = [];
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i];
      const ox = p[0] - cxm, oy = p[1] - cym, ol = Math.hypot(ox, oy) || 1;
      const a = i % 2 ? 11 : 5;
      fr.push([p[0] + (ox / ol) * a, p[1] + (oy / ol) * a * 1.2]);
    }
    const ruff = shp(fr.concat([[cxm, cym]]), true);
    cel(ctx, ruff, { base: D.apron, shade: D.apronS, off: 5, line: D.apronL, lw: lw * 0.85 });
  }
  const path = shp(pts, true);
  cel(ctx, path, {
    base: D.apron, shade: D.apronS, off: 12, line: D.apronL, lw,
    after: g => {
      for (const u of [0.3, 0.68]) {
        const a = [lerp(top[0] - tw, top[0] + tw, u), top[1] + 20];
        const b = [lerp(bx - bw, bx + bw, u), by];
        fillP(g, taper([a, [lerp(a[0], b[0], 0.5), lerp(a[1], b[1], 0.5)], b], lw * 2, WF.head), alpha(D.apronS, 0.7));
      }
      // pocket
      const pk = [lerp(top[0], bx, 0.45) + bw * 0.25, lerp(top[1], by, 0.45)];
      strokeP(g, shp([[pk[0] - 22, pk[1] - 14], [pk[0] - 22, pk[1] + 12], [pk[0] + 20, pk[1] + 14], [pk[0] + 20, pk[1] - 12]], false), alpha(D.apronL, 0.55), lw * 0.9);
    },
  });
  // waistband
  const wl = T(-S.hw(D.waistW, D.depth) - 2, -74), wr = T(S.hw(D.waistW, D.depth) + 2, -74);
  const wl2 = T(-S.hw(D.waistW, D.depth) - 2, -62), wr2 = T(S.hw(D.waistW, D.depth) + 2, -62);
  const band = shp([wl, [top[0], top[1] - 6], wr, wr2, [top[0], top[1] + 6], wl2], true);
  cel(ctx, band, { base: D.apron, shade: D.apronS, off: 4, line: D.apronL, lw: lw * 0.9 });
  // bow tails peeking at the back side
  if (Math.abs(sp) > 0.15) {
    const side = sp > 0 ? -1 : 1;
    const bk = T(side * (S.hw(D.waistW, D.depth) + 4), -70);
    const bow = shp([[bk[0], bk[1] - 4], [bk[0] + side * 26, bk[1] - 18], [bk[0] + side * 30, bk[1] + 2], [bk[0] + side * 8, bk[1] + 4], [bk[0] + side * 22, bk[1] + 40, 1], [bk[0] + side * 4, bk[1] + 10]], true);
    cel(ctx, bow, { base: D.apron, shade: D.apronS, off: 4, line: D.apronL, lw: lw * 0.9 });
  }
}

/* ---------- torso / bodice ---------- */
function drawTorso(ctx, D, P, S, lw) {
  const { c, sp, T, hw } = S;
  const cw = hw(D.chestW, D.depth + 6), ww = hw(D.waistW, D.depth), shw = hw(D.sw * 0.86, D.depth);
  const bust = 4 * Math.abs(sp);
  const sL = sp > 0 ? 0 : bust, sR = sp > 0 ? bust : 0;
  const pts = [
    T(-15, -206), T(-shw + 6, -194), T(-shw - 2, -178, 1), T(-cw - 2 - sL, -150), T(-cw - 1 - sL, -128), T(-ww - 2, -86), T(-ww - 1, -66),
    T(ww + 1, -66), T(ww + 2, -86), T(cw + 1 + sR, -128), T(cw + 2 + sR, -150), T(shw + 2, -178, 1), T(shw - 6, -194), T(15, -206),
  ];
  const path = shp(pts, true);
  cel(ctx, path, { base: D.dress, shade: D.dressS, off: 11, rim: RIM, rimW: 3, line: D.dressL, lw });
  // bib
  const fc = D.depth * sp;
  const bt = T(fc * 0.9, -156), bb = T(fc, -70);
  const bwT = 23 * c + 3, bwB = 27 * c + 3;
  const bib = shp([[bt[0] - bwT, bt[1]], [bt[0] + bwT, bt[1]], [bb[0] + bwB, bb[1]], [bb[0] - bwB, bb[1]]], true);
  {
    const fr = [];
    const n = 14;
    const corners = [[bb[0] - bwB, bb[1]], [bt[0] - bwT, bt[1]], [bt[0] + bwT, bt[1]], [bb[0] + bwB, bb[1]]];
    const poly = sampleCR(corners.map((p, i) => [p[0], p[1], 1]), 5, false);
    const mx = (bt[0] + bb[0]) / 2, my = (bt[1] + bb[1]) / 2;
    poly.forEach((p, i) => { const ox = p[0] - mx, oy = p[1] - my, ol = Math.hypot(ox, oy) || 1; const a = i % 2 ? 8 : 3; fr.push([p[0] + (ox / ol) * a, p[1] + (oy / ol) * a]); });
    cel(ctx, shp(fr.concat([[mx, bb[1]]]), true), { base: D.apron, shade: D.apronS, off: 4, line: D.apronL, lw: lw * 0.8 });
  }
  cel(ctx, bib, { base: D.apron, shade: D.apronS, off: 8, line: D.apronL, lw });
  // straps over shoulders
  for (const sd of [-1, 1]) {
    const a = [bt[0] + sd * bwT * 0.8, bt[1]];
    const b = T(sd * shw * 0.62 + fc * 0.3, -198);
    fillP(ctx, taper([a, [lerp(a[0], b[0], 0.5), lerp(a[1], b[1], 0.5) - 2], b], 9, WF.flat), D.apron);
    strokeP(ctx, taper([a, [lerp(a[0], b[0], 0.5), lerp(a[1], b[1], 0.5) - 2], b], 9, WF.flat), D.apronL, lw * 0.7);
  }
  // buttons / center seam on V, lacing on F
  if (D.id === 'F') {
    for (let i = 0; i < 3; i++) {
      const p = T(fc * 0.9, -140 + i * 22);
      ctx.fillStyle = D.apronL; ctx.beginPath(); ctx.arc(p[0], p[1], 2.2, 0, TAU); ctx.fill();
    }
  }
}

function drawNeck(ctx, D, P, S, lw) {
  const R = HEAD_R;
  const [hx, hy] = S.head;
  const chin = rot(Math.sin(P.head.yaw * 0.62) * R * 0.25, R * 0.95, S.headRot);
  const cx = hx + chin[0], cy = hy + chin[1];
  const nb = S.neck;
  const w0 = 13.5, w1 = 12;
  const path = shp([[nb[0] - w0, nb[1] + 6], [cx - w1, cy - 18], [cx + w1, cy - 18], [nb[0] + w0, nb[1] + 6]], true);
  cel(ctx, path, {
    base: D.skin, shade: D.skinS, off: 6, line: D.skinL, lw: lw * 0.9,
    after: g => {
      g.fillStyle = D.skinS;
      g.beginPath(); g.ellipse(cx, cy - 4, 26, 16, S.headRot, 0, TAU); g.fill();
    },
  });
}

function drawCollar(ctx, D, P, S, lw) {
  const { c, sp, T, hw } = S;
  const shw = hw(D.sw * 0.86, D.depth);
  const fc = D.depth * sp;
  if (D.id === 'V') {
    // wide rounded collar, softly scalloped (evokes the neck frill)
    const pts = [T(-14, -212), T(-shw * 0.7, -200), T(-shw * 0.95, -186)];
    const n = 7;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const x = lerp(-shw * 0.98, shw * 0.98, u) + fc * Math.sin(u * PI) * 0.6;
      const y = -182 + Math.sin(u * PI) * 26 * (0.8 + 0.2 * c);
      pts.push(T(x, y + (i % 2 ? 6 : 0)));
      if (i < n) pts[pts.length - 1][2] = 0;
    }
    pts.push(T(shw * 0.95, -186), T(shw * 0.7, -200), T(14, -212));
    const path = shp(pts, true);
    cel(ctx, path, { base: D.collar, shade: D.collarS, off: 6, line: D.apronL, lw });
    // small blue ribbon at throat
    const r = T(fc * 0.8, -200);
    const rb = shp([[r[0], r[1]], [r[0] - 13, r[1] - 7], [r[0] - 14, r[1] + 7], [r[0], r[1] + 1], [r[0] + 14, r[1] + 7], [r[0] + 13, r[1] - 7]], true);
    cel(ctx, rb, { base: D.ribbon, shade: D.ribbonS, off: 3, line: D.dressL, lw: lw * 0.8 });

    const n = 11;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const x = lerp(-shw * 0.98, shw * 0.98, u) + fc * Math.sin(u * PI) * 0.7;
      const y = -196 + Math.sin(u * PI) * 40;

    }

      const u = i / n;
      const x = lerp(-shw * 0.52, shw * 0.52, u) * 0.75 + fc * 0.4;

        for (let i = 1; i < 6; i++) {
          const u = i / 6;
          const a = T(lerp(-shw * 0.5, shw * 0.5, u) + fc * 0.6, -198);

/* ---------- arms & hands ---------- */
function drawArm(ctx, D, P, S, side, lw) {
  const A = side === 'L' ? S.aL : S.aR;

  const fm = [lerp(ex, hx, 0.3), lerp(ey, hy, 0.3)];
  const arm = shp([
    [sx + n1[0] * wU, sy + n1[1] * wU], [ex + ne[0] * wE, ey + ne[1] * wE], [fm[0] + n2[0] * (wE + 0.8), fm[1] + n2[1] * (wE + 0.8)], [hx + n2[0] * wW, hy + n2[1] * wW],
    [hx - n2[0] * wW, hy - n2[1] * wW], [fm[0] - n2[0] * (wE + 0.5), fm[1] - n2[1] * (wE + 0.5)], [ex - ne[0] * wE, ey - ne[1] * wE], [sx - n1[0] * wU, sy - n1[1] * wU],
  ], true);
  cel(ctx, arm, { base: D.skin, shade: D.skinS, off: 5, rim: RIM, rimW: 2.2, line: D.skinL, lw });
  // short puff sleeve ending at ~55% of the upper arm, white cuff band
  const cut = [lerp(sx, ex, 0.52), lerp(sy, ey, 0.52)];
  const d1 = [ex - sx, ey - sy], l1 = Math.hypot(d1[0], d1[1]) || 1; d1[0] /= l1; d1[1] /= l1;
  const pw = 19 * k;
  const slv = shp([
    [sx - d1[0] * 16 + n1[0] * 10, sy - d1[1] * 16 + n1[1] * 10], [sx + n1[0] * (pw + 3), sy + n1[1] * (pw + 3)], [lerp(sx, cut[0], 0.65) + n1[0] * (pw + 2), lerp(sy, cut[1], 0.65) + n1[1] * (pw + 2)],
    [cut[0] + n1[0] * (wU + 4), cut[1] + n1[1] * (wU + 4)], [cut[0] - n1[0] * (wU + 4), cut[1] - n1[1] * (wU + 4)],
    [lerp(sx, cut[0], 0.65) - n1[0] * (pw + 1), lerp(sy, cut[1], 0.65) - n1[1] * (pw + 1)], [sx - n1[0] * (pw + 2), sy - n1[1] * (pw + 2)], [sx - d1[0] * 16 - n1[0] * 10, sy - d1[1] * 16 - n1[1] * 10],
  ], true);
  cel(ctx, slv, {
    base: D.dress, shade: D.dressS, off: 8, rim: RIM, rimW: 3, line: D.dressL, lw,
    after: g => {
      for (const u of [-0.45, 0.1, 0.55]) {
        const a = [sx + n1[0] * pw * u, sy + n1[1] * pw * u], b = [cut[0] + n1[0] * wU * u * 0.9, cut[1] + n1[1] * wU * u * 0.9];
        fillP(g, taper([a, [lerp(a[0], b[0], 0.5) - d1[0] * 2, lerp(a[1], b[1], 0.5)], b], lw * 1.5, WF.both), alpha(D.dressS, 0.75));

    },
  });

  const ang = opt.rot !== null && opt.rot !== undefined ? opt.rot : Math.atan2(hy - ey, hx - ex);
  drawHand(ctx, D, hx, hy, ang, 1, opt.hand || 'relax', side === 'L' ? 1 : -1, lw, opt);
}

/* generic hand. pose names: relax, open, fist, hold (palm up), pinch, grab, flat, cup, wave */
const HANDS = {
  relax: { curl: [0.45, 0.55, 0.6, 0.65], th: 0.5, sp: 0.1 },
  open: { curl: [0.05, 0.05, 0.08, 0.12], th: 0.9, sp: 0.35 },
  flat: { curl: [0.05, 0.05, 0.05, 0.05], th: 0.25, sp: 0.04 },
  fist: { curl: [1, 1, 1, 1], th: 0.2, sp: 0 },
  hold: { curl: [0.25, 0.25, 0.3, 0.35], th: 0.9, sp: 0.1 },
  pinch: { curl: [0.6, 0.85, 0.9, 0.9], th: 0.55, sp: 0.05 },
  grab: { curl: [0.75, 0.8, 0.82, 0.85], th: 0.35, sp: 0.06 },
  cup: { curl: [0.35, 0.4, 0.45, 0.5], th: 0.6, sp: 0.12 },

function drawHand(ctx, D, x, y, ang, sc, pose, mirror, lw, opt) {
  const H = typeof pose === 'string' ? HANDS[pose] || HANDS.relax : pose;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  const s = sc * 1.42 * (D.id === 'F' ? 1.05 : 1) * ((opt && opt.hs) || 1);
  ctx.scale(s, s * mirror * ((opt && opt.flipY) ? -1 : 1));

  const palm = shp([[-4, -9], [9, -11], [19, -10.5], [21, 0], [19, 10.5], [8, 10.5], [-4, 8]], true);
  // fingers: index (y=-7.5) .. pinky (y=7.5)
  const lens = [14, 15.5, 14.5, 11.5];
  const ys = [-7.6, -2.6, 2.5, 7.2];
  const fingers = [];
  for (let i = 0; i < 4; i++) {
    const c = H.curl[i];
    const sp = (i - 1.5) * H.sp * 0.25;
    let px = 19.5, py = ys[i], a = sp;
    const pts = [[px - 2, py]];
    const segs = [0.47, 0.3, 0.23];
    for (let j = 0; j < 3; j++) {
      a += c * [0.95, 1.25, 0.9][j];
      px += Math.cos(a) * lens[i] * segs[j];
      py += Math.sin(a) * lens[i] * segs[j] * 0.35;
      pts.push([px, py]);
    }
    fingers.push(pts);
  }
  // fingers drawn as capsules (back to front: pinky first)
  for (let i = 3; i >= 0; i--) {
    const fw = [5.2, 5.4, 5.1, 4.5][i];
    const fp = taper(fingers[i], fw, u => (u < 0.85 ? 1 - u * 0.12 : (1 - u) / 0.15 * 0.8 + 0.08), 5);
    cel(ctx, fp, { base: D.skin, shade: D.skinS, off: 2.5, line: D.skinL, lw: llw * 0.85 });
  }
  cel(ctx, palm, { base: D.skin, shade: D.skinS, off: 4, rim: RIM, rimW: 2, line: D.skinL, lw: llw });
  // knuckle hints
  for (let i = 0; i < 3; i++) strokeP(ctx, shp([[17.5, ys[i] + 2.4], [20, ys[i] + 2.6]], false), alpha(D.skinL, 0.6), llw * 0.7);
  // thumb
  const ta = -0.55 - H.th * 0.9;
  const t0 = [5, -8.5];
  const t1 = [t0[0] + Math.cos(ta) * 9, t0[1] + Math.sin(ta) * 9];
  const ta2 = ta + 0.5 + (1 - H.th) * 0.6;
  const t2 = [t1[0] + Math.cos(ta2) * 8.5, t1[1] + Math.sin(ta2) * 8.5];
  const tp = taper([t0, t1, t2], 6.4, u => (u < 0.8 ? 1 : (1 - u) / 0.2 * 0.85 + 0.1), 5);
  cel(ctx, tp, { base: D.skin, shade: D.skinS, off: 2.5, line: D.skinL, lw: llw * 0.85 });
  ctx.restore();
}

/* ---------- head ---------- */
const FACE_F = [[-0.95, 0.0], [-0.95, 0.37], [-0.87, 0.7], [-0.64, 0.98], [-0.32, 1.15], [0, 1.2], [0.32, 1.15], [0.64, 0.98], [0.87, 0.7], [0.95, 0.37], [0.95, 0.0]];

  const a = Math.abs(hy), sg = hy < 0 ? -1 : 1;

}
function drawHead(ctx, D, P, S, lw) {
  const R = HEAD_R;

  const hy = clamp(Hd.yaw, -1, 1);
  const ph = hy * 0.62;
  ctx.save();
  ctx.translate(S.head[0], S.head[1]);
  ctx.rotate(S.headRot);

  // face shape
  const fc = faceContour(hy, F.puff, R);
  const fpts = fc.map(bpt);
  const face = new Path2D();
  face.moveTo(fpts[0][0], fpts[0][1]);
  crInto(face, fpts, false, false);
  face.arc(-Math.sin(ph) * R * 0.06, -R * 0.04, R * 1.0, 0.05, PI - 0.05, true);
  face.closePath();
  const jaw = shpRaw(fpts, false);
  cel(ctx, face, {
    base: D.skin, shade: D.skinS, off: 7, kx: 1.3, rim: RIM, rimW: 2.4,
    after: g => {
      // shadow under bangs
      g.fillStyle = alpha(D.skinS, 0.85);
      g.beginPath(); g.ellipse(Math.sin(ph) * R * 0.3, -R * 0.12 + pitch, R * 1.05, R * 0.42, 0, 0, TAU); g.fill();

  if (F.blush > 0 || F.flush > 0) drawBlush(ctx, D, R, ph, eyeY, F, lw);
  for (const side of [-1, 1]) {
    const th = side * eyeTh + ph;
    const ws = Math.cos(th);
    if (ws < 0.18) continue;
    const ex = eyeR * Math.sin(th), ew = R * 0.5 * Math.pow(ws, 0.85);
    const open = side < 0 ? (F.openL !== null ? F.openL : F.open) : (F.openR !== null ? F.openR : F.open);
    const happy = side < 0 ? (F.happyL !== null ? F.happyL : F.happy) : (F.happyR !== null ? F.happyR : F.happy);
    drawEye(ctx, D, ex, eyeY, ew, eh, side, F, lw, open, happy);
    drawBrow(ctx, D, ex, eyeY, ew, eh, side, F, lw);

  const nx = R * 1.0 * Math.sin(ph), ny = R * 0.76 + pitch;
  fillP(ctx, taper([[nx - R * 0.02 + Math.sign(ph) * R * 0.03, ny - R * 0.07], [nx + Math.sign(ph || 1) * R * 0.035, ny + R * 0.015]], lw * 1.2, WF.head), alpha(D.skinL, 0.75));
  ctx.fillStyle = alpha(D.skinD, 0.35);
  ctx.beginPath(); ctx.ellipse(nx + R * 0.04, ny + R * 0.03, R * 0.05, R * 0.02, 0, 0, TAU); ctx.fill();
  // mouth
  drawMouth(ctx, D, R * Math.sin(ph) * 0.96, R * 0.99 + pitch, R * 0.26 * (0.55 + 0.45 * Math.cos(ph)), F, lw, ph);
  // blush hatches over
  if (F.blush > 0.45 || F.flush > 0.2) drawBlushLines(ctx, D, R, ph, eyeY, F, lw);
  // front hair
  drawEars(ctx, D, P, R, ph, lw, 'front');
  drawHairFront(ctx, D, P, R, ph, lw, pitch);
  if (F.sweat) drawSweat(ctx, R * (hy >= 0 ? -0.95 : 0.95) * 1.05, -R * 0.2, R * 0.28 * F.sweat, lw);
  ctx.restore();
}

function drawEye(ctx, D, ex, ey, ew, eh, o, F, lw, open, happy) {
  const narrow = F.narrow || 0, wide = F.wide || 0;
  if (happy > 0.5) {
    const p = taper([[ex + o * ew * 0.56, ey + eh * 0.14], [ex + o * ew * 0.12, ey - eh * 0.24], [ex - o * ew * 0.46, ey + eh * 0.1]], lw * 2.9, WF.both);
    fillP(ctx, p, D.lash);
    fillP(ctx, taper([[ex + o * ew * 0.5, ey + eh * 0.1], [ex + o * ew * 0.72, ey + eh * 0.02]], lw * 1.4, WF.tail), D.lash);
    return;
  }
  if (open < 0.14) {
    const p = taper([[ex + o * ew * 0.56, ey + eh * 0.02], [ex + o * ew * 0.08, ey + eh * 0.2], [ex - o * ew * 0.46, ey + eh * 0.08]], lw * 2.6, WF.both);
    fillP(ctx, p, D.lash);
    fillP(ctx, taper([[ex + o * ew * 0.5, ey + eh * 0.04], [ex + o * ew * 0.68, ey + eh * 0.14]], lw * 1.3, WF.tail), D.lash);

  ctx.fillStyle = '#fbfbf6';
  ctx.fill(white);
  ctx.save();
  ctx.clip(white);

  const ix = ex + o * ew * 0.02 + (F.lookX || 0) * ew * 0.22;
  const iy = ey + eh * 0.05 + (F.lookY || 0) * eh * 0.13;

  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.ellipse(ix, iy, rx, ry, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = D.irisT; ctx.lineWidth = lw * 0.9; ctx.stroke();
  ctx.fillStyle = D.pupil;
  ctx.beginPath(); ctx.ellipse(ix, iy - ry * 0.06, rx * 0.44 * (1 - 0.45 * wide), ry * 0.5 * (1 - 0.45 * wide), 0, 0, TAU); ctx.fill();
  // lower glow
  ctx.fillStyle = alpha(D.irisB, 0.6);
  ctx.beginPath(); ctx.ellipse(ix + o * rx * 0.1, iy + ry * 0.55, rx * 0.6, ry * 0.25, 0, 0, TAU); ctx.fill();
  // upper lid shadow
  ctx.fillStyle = 'rgba(40,50,90,0.28)';
  ctx.fill(shpRaw(upper.map(p => [p[0], p[1] + eh * 0.16]).concat(upper.slice().reverse().map(p => [p[0], p[1] - eh * 0.2])), true));

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(ix - rx * 0.36, iy - ry * 0.4, rx * 0.36, ry * 0.25, -0.35, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ix + rx * 0.36, iy + ry * 0.34, rx * 0.13, ry * 0.1, 0, 0, TAU); ctx.fill();
  if (F.sparkle > 0) {
    ctx.fillStyle = `rgba(255,255,255,${0.9 * F.sparkle})`;
    ctx.fill(starPath(ix + rx * 0.2, iy - ry * 0.05, rx * 0.5 * F.sparkle, 0.12));

  }
  ctx.restore();
  // lash line
  const lashPts = upper.slice().reverse();
  fillP(ctx, taper(lashPts, lw * (D.id === 'V' ? 3.3 : 3.0), WF.lash, 6), D.lash);
  fillP(ctx, taper([O, [O[0] + o * ew * 0.17, O[1] - eh * 0.1]], lw * 1.9, WF.tail), D.lash);
  if (D.id === 'V') fillP(ctx, taper([[lerp(O[0], upper[1][0], 0.4), lerp(O[1], upper[1][1], 0.4)], [O[0] + o * ew * 0.1, O[1] - eh * 0.24]], lw * 1.3, WF.tail), D.lash);
  // lower lash
  fillP(ctx, taper([[ex + o * ew * 0.48, ey + eh * 0.22], [ex + o * ew * 0.18, lowY - eh * 0.01], [ex - o * ew * 0.05, lowY + eh * 0.01]], lw * 1.05, WF.both), alpha(D.lash, 0.75));

}
function drawBrow(ctx, D, ex, ey, ew, eh, o, F, lw) {

/* ---------- ink: variable line weight + deep shadow ---------- */

    ctx.fill(path);
    ctx.translate(LIGHT.x * k * (o.kx || 1), LIGHT.y * k * (o.ky || 1));
    ctx.fillStyle = o.base;
    ctx.fill(path);
    ctx.restore();

      ctx.save();

      p.rect(-1e5, -1e5, 2e5, 2e5);
      p.addPath(path, { a: 1, b: 0, c: 0, d: 1, e: LIGHT.x * k * 2.1 * (o.kx || 1), f: LIGHT.y * k * 2.1 * (o.ky || 1) });
      ctx.clip(p, 'evenodd');
      ctx.fillStyle = o.deep;
      ctx.fill(path);
      ctx.restore();

  if (o.rim) {
    const r = o.rimW || 3;
    ctx.save();
    ctx.clip(path);
    const p = new Path2D();
    p.rect(-1e5, -1e5, 2e5, 2e5);
    p.addPath(path, { a: 1, b: 0, c: 0, d: 1, e: -LIGHT.x * r, f: -LIGHT.y * r });

    ctx.lineWidth = o.lw;
    ctx.stroke(path);

    ctx.save();
    ctx.translate(-LIGHT.x * o.lw * 0.42, -LIGHT.y * o.lw * 0.42);

/* ---------- FX ---------- */
function fxSparkles(ctx, x, y, r, t, n, seed, size) {
  const R = mulberry(seed || 9);
  ctx.save();
  for (let i = 0; i < n; i++) {
    const a = R() * TAU, d = r * (0.4 + R() * 0.6);
    const ph = R();
    const tw = Math.max(0, Math.sin((t * 2.2 + ph) * PI));
    if (tw <= 0.02) continue;
    const sx = x + Math.cos(a) * d, sy = y + Math.sin(a) * d * 0.8;
    const sz = (size || 14) * (0.5 + R() * 0.7) * tw;
    ctx.fillStyle = `rgba(255,248,214,${0.9 * tw})`;
    ctx.fill(starPath(sx, sy, sz, 0.14));
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    ctx.beginPath(); ctx.arc(sx, sy, sz * 0.18, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function fxImpact(ctx, x, y, r, t, seed) {

  ctx.save();

    ctx.lineWidth = lw * (3.5 - k * 2);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.fillStyle = `rgba(255,252,240,${(1 - t) * 0.9})`;
  ctx.fill(starPath(x, y, r * 0.55 * (1 - t * 0.5), 0.2));
  ctx.restore();
}
function fxPuff(ctx, x, y, s, t, seed) {
  if (t <= 0 || t >= 1) return;

    ctx.strokeStyle = `rgba(150,120,90,${(1 - t) * 0.6})`; ctx.lineWidth = wlw(0.8); ctx.stroke();
  }
  ctx.restore();
}
function fxHumph(ctx, x, y, dir, s, t) {
  // comedic nose steam puff

  const k = E.o2(t);
  ctx.save();

  }

}
function fxCrackle(ctx, x0, y0, x1, y1, t, seed) {
  const R = mulberry(seed + Math.floor(t * 12));

  const pts = [];

function fxSwoosh(ctx, pts, t, col) {

/* screen-space radial focus lines (集中線) */

/* sunbeams + floating dust in P1 world */

function fxMotes(ctx, t, x0, x1, y0, y1, n, seed) {
  const R = mulberry(seed || 77);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < n; i++) {

/* ---------- BACK VIEW (final shot) ---------- */
function drawCharBack(ctx, P) {
  const D = P.D;
  const s = P.s * D.scale;
  ctx.save();

  ctx.scale(s, s);

  const inner = P.inner; // -1 partner on screen-left, +1 on right

  const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 140);

    const lift = Math.max(0, Math.sin(ph2)) * 22;
    const fy = -lift * 0.6 - Math.max(0, -Math.sin(ph2)) * 6;

    cel(ctx, shoe, { base: D.shoe, shade: D.shoeL, off: 3, line: D.shoeL, lw });

  }

  cel(ctx, skirt, {
    base: D.dress, shade: D.dressS, off: 16, rim: RIM, rimW: 4, line: D.dressL, lw,
    after: gg => {
      for (let i = 0; i < 6; i++) {
        const u = (i + 0.5) / 6;
        const top = [lerp(-D.hipW, D.hipW, u) * 0.8, hipY - 10];
        const bx = -hem + u * hem * 2 + vx;
        fillP(gg, taper([top, [lerp(top[0], bx, 0.5), lerp(top[1], hy, 0.5)], [bx, hy + 10]], lw * 2.6, WF.head), alpha(D.dressS, i % 2 ? 0.8 : 0.5));

  cel(ctx, torso, { base: D.dress, shade: D.dressS, off: 10, rim: RIM, rimW: 4, line: D.dressL, lw });
  // apron straps crossing on back
  for (const sd of [-1, 1]) fillP(ctx, taper([[sd * sw * 0.6, hipY - 200], [-sd * 10, hipY - 120], [-sd * D.waistW * 0.7, hipY - 72]], 10, WF.flat), D.apron);

  cel(ctx, band, { base: D.apron, shade: D.apronS, off: 3, line: D.apronL, lw });

    const side = -inner; // tail sways to the outer side

    if (isV) {

    const by = hipY - 70;
    const lp = shp([[0, by - 4], [-30, by - 20], [-34, by + 4], [-6, by + 6]], true);
    const rp = shp([[0, by - 4], [30, by - 20], [34, by + 4], [6, by + 6]], true);

  }

  for (const sd of [-1, 1]) {
    const sh = [sd * sw * 0.86, hipY - 186];
    let hand;
    const isInner = sd === inner;
    if (isInner) hand = P.hold ? [(P.hold[0] - P.x) / s, (P.hold[1] - P.y) / s] : [sd * 70, hipY + 10];
    else hand = [sd * 30, hipY - 40];
    const e = ik(sh[0], sh[1], hand[0], hand[1], D.L1, D.L2, sd > 0 ? -1 : 1);
    const el = [e[0], e[1]], hd = [e[2], e[3]];

    const w1 = 16, w2 = 11;
    const n1 = [-(el[1] - sh[1]), el[0] - sh[0]], l1 = Math.hypot(n1[0], n1[1]) || 1; n1[0] /= l1; n1[1] /= l1;
    const n2 = [-(hd[1] - el[1]), hd[0] - el[0]], l2 = Math.hypot(n2[0], n2[1]) || 1; n2[0] /= l2; n2[1] /= l2;
    if (isInner) {

        cel(ctx, fa, { base: D.skin, shade: D.skinS, off: 5, rim: RIM, rimW: 3, line: D.skinL, lw });

    } else {

    status('음악과 효과음을 만드는 중…');
    await nextFrame();
    try { SND.buffer = await buildAudio(f => { const pc = Math.round(f * 100); status(`음악과 효과음을 만드는 중… ${pc}%`); $('go').textContent = `준비 중… ${pc}%`; }); } catch (e) { console.warn('audio unavailable', e); SND.buffer = null; }
    status(SND.buffer ? '소리를 켜고 감상하세요' : '이 브라우저에서는 소리 없이 재생됩니다');
    $('go').disabled = false; $('go').textContent = '▶ 재생';
    window.__ready = true;
  }
  $('go').addEventListener('click', () => { if (!$('go').disabled) { lastFrame = -1; play(); } });
  $('pp').addEventListener('click', () => (playing ? pause() : play()));
  $('rs').addEventListener('click', () => { seek(0); if (!playing) play(); });
  $('mu').addEventListener('click', () => { SND.muted = !SND.muted; if (gainN) gainN.gain.value = SND.muted ? 0 : 1; $('mu').textContent = SND.muted ? '🔇' : '🔊'; });
  $('fs').addEventListener('click', () => { const el = document.documentElement; if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (() => { })).call(el); else document.exitFullscreen(); });
  $('bar').addEventListener('input', e => seek((+e.target.value / 1000) * DUR));
  document.addEventListener('mousemove', poke); document.addEventListener('touchstart', poke, { passive: true });
  document.addEventListener('keydown', e => {
    if ($('go').disabled) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === 'ArrowRight') { pause(); seek(t + 1 / FPS); }
    else if (e.code === 'ArrowLeft') { pause(); seek(t - 1 / FPS); }
    else if (e.key === 'r' || e.key === 'R') { seek(0); if (!playing) play(); }
    else if (e.key === 'm' || e.key === 'M') $('mu').click();
    else if (e.key === 'f' || e.key === 'F') $('fs').click();
    poke();
  });
  window.__renderAt = tt => { pause(); seek(tt); return true; };
  requestAnimationFrame(loop);
  init();
})();

</script>
</body>
</html>
