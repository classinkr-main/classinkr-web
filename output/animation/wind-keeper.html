<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바람지기 — The Wind Keeper</title>
<meta name="description" content="손그림 2D 셀 애니메이션 스타일의 30초 단편. 바람이 불자 깨어나는 거대한 풍차 로봇 이야기. 모든 그림·음악·효과음은 이 파일 안에서 실시간으로 그려지고 합성됩니다.">
<style>
  :root { --bg: #0d0a08; --ink: #f4ead6; --muted: #bfae92; --accent: #f2b46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #cv { width: min(100vw, calc(100vh * 1.8497)); height: auto; aspect-ratio: 1920 / 1038; display: block; background: #000; box-shadow: 0 0 80px rgba(0,0,0,.6); }
  #cover { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(10,8,6,.15), rgba(10,8,6,.72)); transition: opacity .6s; text-align: center; padding: 16px; }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover > div { padding: 34px 56px 30px; border-radius: 28px; background: radial-gradient(ellipse at center, rgba(12,9,7,.62) 0%, rgba(12,9,7,.38) 55%, rgba(12,9,7,0) 78%); }
  #cover h1 { margin: 0; font-size: clamp(34px, 6vw, 78px); letter-spacing: .08em; font-weight: 700; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  #cover .en { margin: 6px 0 18px; font-size: clamp(13px, 1.6vw, 18px); letter-spacing: .4em; color: #e6d6b8; text-shadow: 0 1px 10px rgba(0,0,0,.8); text-transform: uppercase; }
  #go { font: inherit; font-size: clamp(16px, 2vw, 21px); padding: 12px 30px; border-radius: 999px; border: 1px solid rgba(244,234,214,.5); background: rgba(242,180,106,.18); color: var(--ink); cursor: pointer; backdrop-filter: blur(4px); }
  #go:hover:not(:disabled) { background: rgba(242,180,106,.35); }
  #go:disabled { opacity: .55; cursor: progress; }
  #status { margin-top: 12px; font-size: 14px; color: #e6d6b8; min-height: 1.2em; text-shadow: 0 1px 8px rgba(0,0,0,.85); }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 12px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: opacity .35s; }
  body.ui-on #ui, body:not(.playing) #ui { opacity: 1; }
  body.still #ui, body.still #cover { display: none; }
  #ui button { font: inherit; width: 40px; height: 36px; border-radius: 8px; border: 0; background: rgba(255,255,255,.12); color: var(--ink); cursor: pointer; font-size: 15px; }
  #ui button:hover { background: rgba(255,255,255,.24); }
  #bar { flex: 1; accent-color: var(--accent); min-width: 60px; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 92px; text-align: right; }
  @media (max-width: 520px) { #time { display: none; } #ui { gap: 6px; padding: 8px 10px; } }
</style>
</head>
<body class="ui-on">
<div id="stage">
  <canvas id="cv" width="1920" height="1038" aria-label="애니메이션 화면"></canvas>
  <div id="cover">
    <div>
      <h1>바람지기</h1>
      <div class="en">The Wind Keeper</div>
      <button id="go" disabled>준비 중…</button>
      <div id="status">준비 중…</div>
    </div>
  </div>
  <div id="ui">
    <button id="pp" aria-label="재생">▶</button>
    <button id="rs" aria-label="처음부터">↺</button>
    <input id="bar" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
    <span id="time">0:00.0 / 0:30.0</span>
    <button id="mu" aria-label="소리 켜기/끄기">🔊</button>
    <button id="fs" aria-label="전체 화면">⛶</button>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   CORE — constants, math, easing, noise, path helpers
   ============================================================ */
const W = 1920, H = 1038, FPS = 24, DUR = 30;
const PI = Math.PI, TAU = PI * 2;
const CAM = { x: 0, y: 0, z: 1 };
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const E = {
  lin: t => t,
  i2: t => t * t,
  o2: t => 1 - (1 - t) * (1 - t),
  io2: t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t)),
  i3: t => t * t * t,
  o3: t => 1 - Math.pow(1 - t, 3),
  io3: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  o4: t => 1 - Math.pow(1 - t, 4),
  o5: t => 1 - Math.pow(1 - t, 5),
  i4: t => t * t * t * t,
  ob: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  ob2: t => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  sm: t => t * t * (3 - 2 * t),
  step: t => (t < 1 ? 0 : 1),
  hold: t => 0,
};
/* Keyframes:  K(t, [[t0,v0],[t1,v1,'o3'],...])  — ease named at the destination key */
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i];
    if (t <= k[0]) {
      const p = keys[i - 1];
      const d = k[0] - p[0];
      const u = d > 0 ? (t - p[0]) / d : 1;
      return lerp(p[1], k[1], E[k[2] || 'io2'](u));

}
/* Discrete keys (for mouth shapes etc.) */
function D(t, keys) {
  let v = keys[0][1];
  for (const k of keys) if (t >= k[0]) v = k[1];
  return v;
}
/* Pulse 0→1→0 between a..b with ramps r */
function pulse(t, a, b, r1, r2) {
  r2 = r2 === undefined ? r1 : r2;
  if (t < a || t > b) return 0;
  return Math.min(1, (t - a) / r1, (b - t) / r2);
}

/* ---------- random / noise ---------- */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

  let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);

function vnoise(x, seed) {

  const a = hash2(i, seed || 0), b = hash2(i + 1, seed || 0);
  return a + (b - a) * f * f * (3 - 2 * f);

/* signed smooth noise -1..1 */
const sn = (x, s) => vnoise(x, s) * 2 - 1;

/* ---------- color ---------- */
function hexRgb(h) {
  if (h[0] === '#') h = h.slice(1);
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgba = (r, g, b, a) => `rgba(${r | 0},${g | 0},${b | 0},${a === undefined ? 1 : a})`;
function mixc(h1, h2, t, a) {
  const A = hexRgb(h1), B = hexRgb(h2);

function alpha(h, a) { const c = hexRgb(h); return rgba(c[0], c[1], c[2], a); }
function jit(h, rnd, amt, a) {

/* ---------- boil (hand-drawn line wobble) ---------- */
const BOIL = { seed: 1, amp: 0.4, n: 0, on: true };
function boilReset(seed, amp) { BOIL.seed = seed; BOIL.n = 0; if (amp !== undefined) BOIL.amp = amp; }
function bpt(p) {
  if (!BOIL.on || BOIL.amp === 0) return p;
  const n = BOIL.n++;
  const a = BOIL.amp;
  const q = [p[0] + (hash2(n, BOIL.seed) - 0.5) * 2 * a, p[1] + (hash2(n, BOIL.seed + 7919) - 0.5) * 2 * a];
  if (p[2]) q[2] = p[2];

/* ---------- curve helpers ---------- */
/* Catmull-Rom → bezier into a Path2D. p[2]===1 marks a sharp corner. */
function crInto(path, pts, closed, move) {
  const n = pts.length;
  if (n < 2) return path;
  const P = i => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  if (move !== false) path.moveTo(pts[0][0], pts[0][1]);
  else path.lineTo(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    let c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    let c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    if (p1[2] === 1) { c1x = p1[0] + (p2[0] - p1[0]) / 3; c1y = p1[1] + (p2[1] - p1[1]) / 3; }
    if (p2[2] === 1) { c2x = p2[0] - (p2[0] - p1[0]) / 3; c2y = p2[1] - (p2[1] - p1[1]) / 3; }

}
/* boiled smooth shape */
function shp(pts, closed) {
  const q = pts.map(bpt);
  return crInto(new Path2D(), q, closed !== false);
}
function shpRaw(pts, closed) { return crInto(new Path2D(), pts, closed !== false); }
/* sample a CR spline to polyline */
function sampleCR(pts, per, closed) {
  const out = [];
  const n = pts.length;
  if (n < 2) return pts.slice();
  const P = i => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let s = 0; s < per; s++) {
      const t = s / per, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);

}
/* tapered brush stroke along CR spline. wf(u) gives width multiplier */
function taper(pts, w, wf, per) {
  const q = pts.map(bpt);
  const poly = sampleCR(q, per || 6, false);
  const n = poly.length;
  if (n < 2) return new Path2D();
  const L = [0];
  for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
  const tot = L[n - 1] || 1;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const a = poly[Math.max(0, i - 1)], b = poly[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const u = L[i] / tot;
    const ww = w * (wf ? wf(u) : Math.pow(Math.sin(PI * clamp(u, 0.02, 0.98)), 0.55)) * 0.5;
    left.push([poly[i][0] - dy * ww, poly[i][1] + dx * ww]);
    right.push([poly[i][0] + dy * ww, poly[i][1] - dx * ww]);
  }
  const p = new Path2D();
  p.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(left[i][0], left[i][1]);

}
const WF = {
  both: u => Math.pow(Math.sin(PI * clamp(u, 0.03, 0.97)), 0.5),
  tail: u => Math.pow(1 - u, 0.7) * Math.min(1, u * 8 + 0.35),
  head: u => Math.pow(u, 0.7) * Math.min(1, (1 - u) * 8 + 0.35),
  lash: u => (0.35 + 0.65 * Math.pow(u, 0.8)) * Math.min(1, (1 - u) * 7 + 0.2),
  flat: u => Math.min(1, u * 10 + 0.3, (1 - u) * 10 + 0.3),

/* ---------- cel painting helper ----------
   Global light from upper-left (window side). Shadow falls lower-right. */
const LIGHT = { x: -1, y: -0.75 };
function cel(ctx, path, o) {
  ctx.fillStyle = o.base;
  ctx.fill(path);
  if (o.shade) {
    ctx.save();
    ctx.clip(path);
    ctx.fillStyle = o.shade;
    ctx.fill(path);
    const k = o.off === undefined ? 8 : o.off;
    ctx.translate(LIGHT.x * k * (o.kx || 1), LIGHT.y * k * (o.ky || 1));
    ctx.fillStyle = o.base;
    ctx.fill(path);
    ctx.restore();
  }
  if (o.rim) {
    const r = o.rimW || 3;
    ctx.save();
    ctx.clip(path);
    const p = new Path2D();
    p.rect(-1e5, -1e5, 2e5, 2e5);
    p.addPath(path, { a: 1, b: 0, c: 0, d: 1, e: -LIGHT.x * r, f: -LIGHT.y * r });
    ctx.clip(p, 'evenodd');
    ctx.fillStyle = o.rim;
    ctx.fill(path);
    ctx.restore();
  }
  if (o.after) { ctx.save(); ctx.clip(path); o.after(ctx); ctx.restore(); }

    ctx.strokeStyle = o.line;
    ctx.lineWidth = o.lw;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke(path);
  }

function strokeP(ctx, path, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(path);
}
function fillP(ctx, path, col) { ctx.fillStyle = col; ctx.fill(path); }

/* 2-bone IK. returns elbow point. bend: +1 / -1 chooses side */
function ik(sx, sy, tx, ty, L1, L2, bend) {
  let dx = tx - sx, dy = ty - sy;
  let d = Math.hypot(dx, dy);
  const maxd = (L1 + L2) * 0.999;
  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }
  if (d < 1e-3) d = 1e-3;
  const a = Math.atan2(dy, dx);
  const c = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const b = Math.acos(c) * (bend >= 0 ? 1 : -1);
  return [sx + Math.cos(a + b) * L1, sy + Math.sin(a + b) * L1, sx + dx, sy + dy];
}
function rot(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }

/* simple 4-point sparkle star */
function starPath(x, y, r, thin) {
  const p = new Path2D();
  const t = r * (thin || 0.18);
  p.moveTo(x, y - r);
  p.quadraticCurveTo(x + t, y - t, x + r, y);
  p.quadraticCurveTo(x + t, y + t, x, y + r);
  p.quadraticCurveTo(x - t, y + t, x - r, y);
  p.quadraticCurveTo(x - t, y - t, x, y - r);
  p.closePath();
  return p;

/* ============================================================
   LAND — gouache landscape painting (dawn valley)
   PANO world: x 0..3800, y -900..1500, horizon ~ y 900
   ============================================================ */
const LAND = {};
const SUN = { x: 420, y: 760 };              // sun just risen, left (PANO coords)
function dabsL(g, R, x, y, w, h, cols, n, r0, r1, a0, a1, sx, sy, rotJ) {
  sx = sx || 1; sy = sy || 1;
  for (let i = 0; i < n; i++) {
    const px = x + R() * w, py = y + R() * h, r = lerp(r0, r1, R());
    g.fillStyle = jit(cols[(R() * cols.length) | 0], R, 10, lerp(a0, a1, R()));

function strokesL(g, R, x, y, w, h, cols, n, l0, l1, wid, ang, angJ, a0, a1) {
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const px = x + R() * w, py = y + R() * h, L = lerp(l0, l1, R());
    const an = ang + (R() - 0.5) * angJ;
    g.strokeStyle = jit(cols[(R() * cols.length) | 0], R, 10, lerp(a0, a1, R()));
    g.lineWidth = wid * (0.5 + R());

/* ---------- Ghibli-style cumulus: crisp silhouette, soft painted interior ---------- */
function paintCloud(g, R, cx, by, w, h, sunDir, o) {

    const r = h * (0.13 + 0.17 * dome) * (0.8 + R() * 0.4);

    const r = h * (0.1 + 0.16 * dome) * (0.75 + R() * 0.45);

    const u = 0.08 + R() * 0.84, dome = Math.pow(Math.sin(PI * u), 1.15);

  const Mc = mk(cw, ch), m = setup(Mc);
  m.fillStyle = '#000';
  for (const [x, y, r] of puffs) { m.beginPath(); m.arc(x, y, r, 0, TAU); m.fill(); }
  m.clearRect(ox - 10, by, cwU + 20, chU);
  const Sc = mk(cw, ch), s = setup(Sc);

    s.fillStyle = mixc(shBot, shTop, k);

    s.save(); s.beginPath(); s.arc(x, y, r, 0, TAU); s.clip();

}
function skyGradient(g, x, y, w, h, horizonY) {

/* ---------- SKY (pano) ---------- */

function paperG(g, R, x, y, w, h, n) {

/* ---------- MOUNTAINS ---------- */
function paintMountains() {
  const sc = 0.8, x0 = 0, y0 = 420, w = 3800, h = 640;
  const c = mk(Math.round(w * sc), Math.round(h * sc)), g = c.getContext('2d');
  g.scale(sc, sc); g.translate(-x0, -y0);
  const R = mulberry(57);
  const ridges = [
    { base: 930, amp: 330, f: 1 / 900, seed: 3, col: '#a9b6d2', lit: '#efcfc0', sh: '#8f9ebf' },
    { base: 950, amp: 230, f: 1 / 650, seed: 9, col: '#8ea3c2', lit: '#e3c3b4', sh: '#7389ad' },
    { base: 985, amp: 140, f: 1 / 420, seed: 21, col: '#7a97a8', lit: '#cfc0a0', sh: '#5f7c92' },
  ];
  for (const rd of ridges) {
    const pts = [];
    for (let x = x0 - 20; x <= x0 + w + 20; x += 12) {
      const n = fbm(x * rd.f, rd.seed, 5);
      const peak = Math.pow(Math.max(0, n + 0.25), 1.4);
      pts.push([x, rd.base - rd.amp * (0.25 + peak * 1.6)]);
    }
    const sil = [...pts, [x0 + w + 20, y0 + h], [x0 - 20, y0 + h]];
    polyL(g, sil, rd.col);
    g.save();
    g.beginPath(); sil.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.clip();
    for (let i = 1; i < pts.length - 1; i++) {
      const slope = (pts[Math.min(pts.length - 1, i + 4)][1] - pts[Math.max(0, i - 4)][1]) / 96;
      const [x, y] = pts[i];
      const litK = clamp(-slope * 1.6, 0, 1), shK = clamp(slope * 1.6, 0, 1);
      const col = litK > 0 ? mixc(rd.col, rd.lit, litK * 0.85) : mixc(rd.col, rd.sh, shK);
      const depth = 60 + rd.amp * 0.9;
      const gr = g.createLinearGradient(0, y, 0, y + depth);
      gr.addColorStop(0, col); gr.addColorStop(1, alpha(rd.col, 0));
      g.fillStyle = gr; g.fillRect(x - 6, y - 2, 13, depth);
    }
    dabsL(g, R, x0, rd.base - rd.amp * 2, w, rd.amp * 2.5, [rd.col, rd.sh], 600, 6, 20, 0.06, 0.16);
    // base haze
    const hz = g.createLinearGradient(0, rd.base - rd.amp * 0.5, 0, rd.base + 40);
    hz.addColorStop(0, 'rgba(255,236,214,0)'); hz.addColorStop(1, 'rgba(250,230,212,0.75)');
    g.fillStyle = hz; g.fillRect(x0, rd.base - rd.amp * 0.5, w, rd.amp + 200);
    g.restore();
  }
  LAND.MTN = { c, x0, y0, w, h, sc };
}

/* ---------- VALLEY (mid distance) ---------- */
function paintValley() {
  const sc = 1, x0 = 0, y0 = 860, w = 3800, h = 480;
  const c = mk(w, h), g = c.getContext('2d');
  g.translate(-x0, -y0);
  const R = mulberry(77);
  // rolling far hills
  const hill = x => 940 + fbm(x / 500, 5, 4) * 60;
  const pts = [];
  for (let x = -20; x <= w + 20; x += 10) pts.push([x, hill(x)]);
  polyL(g, [...pts, [w + 20, 1400], [-20, 1400]], '#7d9a6a');
  g.save(); g.beginPath(); [...pts, [w + 20, 1400], [-20, 1400]].forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.clip();
  const fg = g.createLinearGradient(0, 920, 0, 1340);
  fg.addColorStop(0, '#9fb28a'); fg.addColorStop(0.4, '#86a56a'); fg.addColorStop(1, '#5f8a4c');
  g.fillStyle = fg; g.fillRect(0, 900, w, 460);
  // patchwork fields in perspective
  for (let row = 0; row < 9; row++) {
    const yA = 960 + row * row * 4.2 + row * 14, yB = yA + 10 + row * 7;
    let x = -60 + R() * 80;
    while (x < w) {
      const fw = 90 + R() * 200 + row * 30;
      const col = ['#a9bd78', '#c5c27a', '#8fae62', '#b7a96a', '#9cb86e', '#7fa35a'][(R() * 6) | 0];
      const sk = (x - 1900) * 0.04;
      polyL(g, [[x, yA], [x + fw, yA], [x + fw + sk * 0.3, yB], [x + sk * 0.3, yB]], alpha(col, 0.85));
      strokesL(g, R, x, yA, fw, yB - yA, [col, '#6f8f4f'], Math.round(fw / 12), 10, 30, 1.5, 0, 0.2, 0.2, 0.4);
      x += fw + 4 + R() * 10;
    }
    hline2(g, 0, yB, w, yB, 'rgba(70,90,50,0.35)', 2 + row * 0.4);
  }
  // river
  const rv = [];
  for (let i = 0; i <= 40; i++) {
    const u = i / 40;
    rv.push([lerp(200, 3600, u) + Math.sin(u * 9) * 120, 975 + Math.pow(u, 1.0) * 10 + Math.sin(u * 13) * 18 + u * u * 140]);
  }
  for (let pass = 0; pass < 2; pass++) {
    g.strokeStyle = pass ? '#e9eef0' : '#a8c4d4';
    g.lineWidth = pass ? 3 : 9;
    g.beginPath(); rv.forEach((p, i) => { const ww = p[1] > 1050 ? 1.6 : 1; i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.stroke();
  }
  // tree groves & hedgerows
  for (let i = 0; i < 700; i++) {
    const gx = (Math.floor(i / 14) * 397) % 3800;
    const x = (gx + R() * 160) % 3800, y = 950 + Math.pow(R(), 1.6) * 360;
    const s = 3 + (y - 950) * 0.04 + R() * 3.5;
    g.fillStyle = jit(R() < 0.5 ? '#3f6440' : '#4d7348', R, 10, 0.95);
    g.beginPath(); g.ellipse(x, y, s * 1.3, s, 0, 0, TAU); g.fill();
    g.fillStyle = jit('#a7c06a', R, 12, 0.6);
    g.beginPath(); g.ellipse(x - s * 0.4, y - s * 0.35, s * 0.7, s * 0.45, -0.3, 0, TAU); g.fill();
  }
  // mist band
  g.restore();
  const ms = g.createLinearGradient(0, 862, 0, 1030);
  ms.addColorStop(0, 'rgba(255,240,222,0)'); ms.addColorStop(0.35, 'rgba(255,240,222,0.8)'); ms.addColorStop(0.6, 'rgba(255,238,220,0.4)'); ms.addColorStop(1, 'rgba(255,238,220,0)');
  g.fillStyle = ms; g.fillRect(0, 860, w, 170);
  dabsL(g, R, 0, 930, w, 70, ['#fff4e6', '#fbe6d4'], 220, 20, 60, 0.12, 0.3, 3, 0.5, 0.1);
  paperG(g, R, 0, 860, w, h, 5000);

}
function hline2(g, x0, y0, x1, y1, col, lw) { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }

/* ---------- NEAR RIDGE (pano foreground) ---------- */
function ridgeY(x) { return 1235 - 190 * E.sm(clamp((x - 1300) / 1300, 0, 1)) + fbm(x / 300, 44, 3) * 22 + 40 * E.sm(clamp((x - 3000) / 700, 0, 1)); }
function paintRidge() {
  const sc = 1, x0 = 0, y0 = 960, w = 3800, h = 540;
  const c = mk(w, h), g = c.getContext('2d');
  g.translate(-x0, -y0);
  const R = mulberry(91);
  const pts = [];
  for (let x = -20; x <= w + 20; x += 8) pts.push([x, ridgeY(x)]);
  const sil = [...pts, [w + 20, 1500], [-20, 1500]];
  const gg = g.createLinearGradient(0, 1000, 0, 1500);
  gg.addColorStop(0, '#9dbb5a'); gg.addColorStop(0.3, '#6f9a45'); gg.addColorStop(1, '#3f6a34');
  polyL(g, sil, gg);
  g.save(); g.beginPath(); sil.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.clip();
  // sunlit rim along ridge top (sun from left/back)
  for (let i = 0; i < pts.length; i += 2) {
    const [x, y] = pts[i];
    g.fillStyle = jit('#e2e08a', R, 12, 0.6);
    g.beginPath(); g.ellipse(x, y + 6, 10, 6, 0, 0, TAU); g.fill();
  }
  // grass strokes, darker lower
  for (let i = 0; i < 9000; i++) {
    const x = R() * w, yTop = ridgeY(x), y = yTop + Math.pow(R(), 1.3) * (1500 - yTop);
    const d = (y - yTop) / 300;
    g.strokeStyle = jit(d < 0.25 ? '#b9cf6c' : d < 0.6 ? '#7ea64c' : '#4f7a3c', R, 14, 0.55);
    g.lineWidth = 1.5 + d * 2;
    const L = 8 + d * 18;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 3, y - L * 0.5, x + 6 + R() * 4, y - L); g.stroke();
  }
  // wildflowers
  for (let i = 0; i < 900; i++) {
    const x = R() * w, yTop = ridgeY(x), y = yTop + 10 + Math.pow(R(), 1.5) * 300;
    g.fillStyle = ['#fffaf0', '#f6e070', '#f2b6c4', '#c7b8f0'][(R() * 4) | 0];
    g.beginPath(); g.arc(x, y, 1.8 + (y - yTop) * 0.012, 0, TAU); g.fill();
  }
  // shadowed lower slope
  const sh = g.createLinearGradient(0, 1200, 0, 1500);
  sh.addColorStop(0, 'rgba(40,60,50,0)'); sh.addColorStop(1, 'rgba(30,45,45,0.45)');
  g.fillStyle = sh; g.fillRect(0, 1150, w, 360);
  g.restore();
  // lone tree on ridge
  paintTree(g, R, 1720, ridgeY(1720) + 6, 1.0);
  // rocks
  for (const rx of [1460, 2780, 3240]) {
    const ry = ridgeY(rx) + 8;
    polyL(g, [[rx - 26, ry + 6], [rx - 18, ry - 14], [rx + 6, ry - 20], [rx + 26, ry - 4], [rx + 24, ry + 8]], '#8a8a7a');
    polyL(g, [[rx - 18, ry - 14], [rx + 6, ry - 20], [rx + 2, ry - 4], [rx - 14, ry]], '#b8b49a');
  }
  paperG(g, R, 0, 960, w, h, 6000);
  LAND.RIDGE = { c, x0, y0, w, h, sc };
}
function paintTree(g, R, x, y, s) {
  // trunk
  g.fillStyle = '#4a3a2a';
  g.beginPath(); g.moveTo(x - 9 * s, y); g.quadraticCurveTo(x - 4 * s, y - 70 * s, x - 14 * s, y - 130 * s); g.lineTo(x + 2 * s, y - 132 * s); g.quadraticCurveTo(x + 6 * s, y - 70 * s, x + 11 * s, y); g.closePath(); g.fill();
  g.strokeStyle = '#4a3a2a'; g.lineWidth = 6 * s;
  g.beginPath(); g.moveTo(x - 6 * s, y - 100 * s); g.lineTo(x - 50 * s, y - 150 * s); g.moveTo(x - 2 * s, y - 115 * s); g.lineTo(x + 40 * s, y - 165 * s); g.stroke();

  for (const [dx, dy, r] of cl) { g.fillStyle = jit('#3d5f3a', R, 8, 1); g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, TAU); g.fill(); }
  for (const [dx, dy, r] of cl) { g.fillStyle = jit('#6f9450', R, 10, 0.95); g.beginPath(); g.arc(x + (dx - r * 0.25) * s, y + (dy - r * 0.25) * s, r * 0.7 * s, 0, TAU); g.fill(); }
  for (const [dx, dy, r] of cl) { g.fillStyle = jit('#c6d27a', R, 10, 0.7); g.beginPath(); g.arc(x + (dx - r * 0.45) * s, y + (dy - r * 0.45) * s, r * 0.32 * s, 0, TAU); g.fill(); }
  dabsL(g, R, x - 150 * s, y - 280 * s, 300 * s, 180 * s, ['#4f7444', '#8aab5a'], 120, 3 * s, 8 * s, 0.4, 0.8);
}

/* ---------- CLOSE SKY (screen-res for near shots) ---------- */
function paintSkyClose() {

/* ---------- HILLTOP GROUND plate (near shots, world coords around robot) ----------
   world: x -1800..1800, ground surface ~ y=0 (slopes down to the right)  */
function hillY(x) { return 30 + x * 0.06 + fbm((x + 3000) / 380, 61, 3) * 30; }
function paintHillPlate() {
  const x0 = -2000, y0 = -260, w = 4000, h = 1300, sc = 0.75;
  const c = mk(Math.round(w * sc), Math.round(h * sc)), g = c.getContext('2d');
  g.scale(sc, sc); g.translate(-x0, -y0);
  const R = mulberry(202);
  // distant valley strip visible behind the hill crest
  const pts = [];
  for (let x = x0 - 20; x <= x0 + w + 20; x += 10) pts.push([x, hillY(x)]);
  const sil = [...pts, [x0 + w + 20, y0 + h], [x0 - 20, y0 + h]];
  const gg = g.createLinearGradient(0, -100, 0, 1000);
  gg.addColorStop(0, '#a6c25e'); gg.addColorStop(0.25, '#7aa54a'); gg.addColorStop(1, '#3d6634');
  polyL(g, sil, gg);
  g.save(); g.beginPath(); sil.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.clip();
  for (let i = 0; i < 26000; i++) {
    const x = x0 + R() * w, yT = hillY(x), y = yT + Math.pow(R(), 1.25) * (y0 + h - yT);
    const d = clamp((y - yT) / 700, 0, 1);
    g.strokeStyle = jit(d < 0.12 ? '#c6d877' : d < 0.45 ? '#86ae50' : '#527f3e', R, 14, 0.5);
    g.lineWidth = 2 + d * 4;
    const L = 12 + d * 40;
    const lean = 4 + R() * 8;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.4, y - L * 0.55, x + lean, y - L); g.stroke();
  }
  for (let i = 0; i < 2600; i++) {
    const x = x0 + R() * w, yT = hillY(x), y = yT + 6 + Math.pow(R(), 1.4) * 900;
    const r = 2.2 + (y - yT) * 0.012;
    g.fillStyle = ['#fffaf0', '#f6e070', '#f2b6c4', '#c7b8f0', '#fffaf0'][(R() * 5) | 0];
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.fillStyle = 'rgba(240,200,80,0.8)'; g.beginPath(); g.arc(x, y, r * 0.35, 0, TAU); g.fill();
  }
  const sh = g.createLinearGradient(0, 300, 0, 1040);
  sh.addColorStop(0, 'rgba(30,50,40,0)'); sh.addColorStop(1, 'rgba(25,40,40,0.4)');
  g.fillStyle = sh; g.fillRect(x0, 300, w, 800);
  g.restore();
  // crest highlight
  g.strokeStyle = 'rgba(240,236,160,0.65)'; g.lineWidth = 5;
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1] + 3) : g.moveTo(p[0], p[1] + 3))); g.stroke();
  paperG(g, R, x0, y0, w, h, 8000);
  LAND.HILL = { c, x0, y0, w, h, sc };
}

function paintLand() {
  paintSkyPano();

/* draw a layer image (world-positioned) with camera + parallax */
function drawLayer(ctx, L, par, refX, refY) {
  // par: 1 = moves with world, <1 = farther. Implemented by offsetting toward camera.
  const ox = (CAM.x - refX) * (1 - par), oy = (CAM.y - refY) * (1 - par);
  ctx.drawImage(L.c, 0, 0, L.c.width, L.c.height, L.x0 + ox, L.y0 + oy, L.w, L.h);
}

/* ============================================================
   ROBOT — "바람지기" (the Wind Keeper)
   Rig-local coords: origin at ground between feet, y up = negative.
   Standing height ~ 1000 units.
   ============================================================ */
const RB = {
  enamel: '#ebe1c8', enamelS: '#b8aa8a', enamelD: '#8f8268',
  copper: '#c47c48', copperS: '#87492a', copperH: '#f2b47e', patina: '#6fae96',
  iron: '#5e6460', ironS: '#3a3f3d', ironH: '#949a90',
  brass: '#d6aa54', brassS: '#9a7230', brassH: '#fbe3a0',
  rust: '#a85a34', rustD: '#7a3a20',
  canvas: '#f2e8cf', canvasS: '#cbbb96', wood: '#6e4c30', woodS: '#4a3220',
  moss: '#6f9440', mossS: '#4b6c30', mossH: '#b1cb62',
  glass: '#22424c', glassH: '#7fb6c4', glow: '#ffc760', glowC: '#fff2c4',
  line: '#33241a', lineS: '#4a3426',
};
const RRIM = 'rgba(255,226,170,0.7)';
const TIP = { lift: 0 };

function newRobot() {
  return {
    x: 0, y: 0, s: 1, yaw: 0, sit: 0, lean: 0, slump: 0, bob: 0, hipX: 0,
    head: { yaw: 0, pitch: 0, tilt: 0 },
    eye: { open: 1, glow: 1, look: 0, ring: 0 },
    armL: { x: -230, y: -330, hand: 'rest', w: false, front: false },
    armR: { x: 230, y: -330, hand: 'rest', w: false, front: false },
    legs: { mode: 'stand', phase: 0, stride: 0, footL: null, footR: null },
    mill: { a: 0, blur: 0 },
    vane: 0, seed: 0, dust: 0, moss: 1, glowChest: 0,
    shadow: 1,
  };
}
function rSkel(P) {
  const phi = P.yaw, c = Math.cos(phi), sp = Math.sin(phi);
  const st = 1 - P.sit;
  const hipY = lerp(-84, -330, E.io2(st)) + P.bob;
  const lean = P.lean;
  const hipX = P.hipX;
  const T = (x, y) => { const r = rot(x, y, lean); return [hipX + r[0], hipY + r[1]]; };
  const S = { phi, c, sp, st, hipY, hipX, lean, T };
  const sl = P.slump || 0;
  // shoulders
  S.shY = -318 + sl * 18;
  S.shL = T(-205 * c, S.shY); S.shR = T(205 * c, S.shY);
  S.zL = 205 * sp; S.zR = -205 * sp;
  S.neck = T(0, -386 + sl * 22);
  const hp = rot(sp * sl * 30, -126 + sl * 30, lean * 0.8);
  S.head = [S.neck[0] + hp[0], S.neck[1] + hp[1]];
  S.headYaw = phi + P.head.yaw;
  S.headPitch = P.head.pitch + sl * 0.5;
  S.headRot = P.head.tilt + lean * 0.5;
  // arms
  const arm = (A, sh, bend) => {
    let tx = A.x, ty = A.y;
    if (A.w) { tx = (A.x - P.x) / P.s; ty = (A.y - P.y) / P.s; }
    const e = ik(sh[0], sh[1], tx, ty, 225, 215, A.bend !== undefined ? A.bend : bend);
    return { s: sh, e: [e[0], e[1]], h: [e[2], e[3]] };
  };
  S.aL = arm(P.armL, S.shL, 1);
  S.aR = arm(P.armR, S.shR, -1);
  // legs
  const dir = sp >= 0 ? 1 : -1;
  const legFor = (side) => {
    const lat = side * 92;
    const hipJ = T(lat * c, 22);
    let foot;
    const L = P.legs;
    if (L.mode === 'walk') {
      const a = TAU * L.phase + (side < 0 ? 0 : PI);
      const fwd = Math.sin(a) * L.stride * 0.5;
      const lift = Math.max(0, Math.cos(a)) * (L.lift || 40);
      foot = [hipX + lat * c + dir * fwd * Math.abs(sp) * 1.05, -lift + sp * side * -10 + c * fwd * 0.3];
    } else foot = [hipX * 0.2 + side * (104 * c), side * sp * -10];
    const sitFoot = [side * 168 * c + dir * 120 * Math.abs(sp), 36];
    const sitKnee = [side * 158 * c + dir * 190 * Math.abs(sp), -262];
    if (side < 0 && L.footL) foot = L.footL; if (side > 0 && L.footR) foot = L.footR;
    const fk = [lerp(sitFoot[0], foot[0], E.io2(st)), lerp(sitFoot[1], foot[1], E.io2(st))];
    const e = ik(hipJ[0], hipJ[1], fk[0], fk[1], 165, 165, dir > 0 ? -1 : 1);
    let knee = [e[0], e[1]];
    const ks = E.io2(clamp(st * 1.4, 0, 1));
    knee = [lerp(sitKnee[0], knee[0], ks), lerp(sitKnee[1], knee[1], ks)];
    return { hip: hipJ, knee, foot: fk, z: side * -sp };
  };
  S.lL = legFor(-1); S.lR = legFor(1);
  return S;
}

/* ---------- drawing helpers ---------- */
function tube(ctx, a, b, ra, rb, o) {
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
  const nx = -dy / d, ny = dx / d;
  const ux = dx / d, uy = dy / d;
  const pts = [
    [a[0] + nx * ra, a[1] + ny * ra], [lerp(a[0], b[0], 0.5) + nx * (ra + rb) / 2 * 1.03, lerp(a[1], b[1], 0.5) + ny * (ra + rb) / 2 * 1.03], [b[0] + nx * rb, b[1] + ny * rb],
    [b[0] + ux * rb * 0.5 + nx * rb * 0.6, b[1] + uy * rb * 0.5 + ny * rb * 0.6], [b[0] + ux * rb * 0.62, b[1] + uy * rb * 0.62], [b[0] + ux * rb * 0.5 - nx * rb * 0.6, b[1] + uy * rb * 0.5 - ny * rb * 0.6],
    [b[0] - nx * rb, b[1] - ny * rb], [lerp(a[0], b[0], 0.5) - nx * (ra + rb) / 2 * 1.03, lerp(a[1], b[1], 0.5) - ny * (ra + rb) / 2 * 1.03], [a[0] - nx * ra, a[1] - ny * ra],
    [a[0] - ux * ra * 0.5 - nx * ra * 0.6, a[1] - uy * ra * 0.5 - ny * ra * 0.6], [a[0] - ux * ra * 0.62, a[1] - uy * ra * 0.62], [a[0] - ux * ra * 0.5 + nx * ra * 0.6, a[1] - uy * ra * 0.5 + ny * ra * 0.6],
  ];
  const p = shp(pts, true);
  cel(ctx, p, {
    base: o.base, shade: o.shade, off: o.off || 14, rim: o.rim === false ? null : RRIM, rimW: o.rimW || 5,
    after: g => {
      if (o.bands) for (const u of o.bands) {
        const cx = lerp(a[0], b[0], u), cy = lerp(a[1], b[1], u), r = lerp(ra, rb, u);
        fillP(g, taper([[cx - nx * r * 1.1, cy - ny * r * 1.1], [cx + ux * 3, cy + uy * 3], [cx + nx * r * 1.1, cy + ny * r * 1.1]], o.bandW || 12, WF.flat), o.bandCol || RB.copper);
        strokeP(g, shp([[cx - nx * r * 1.1 + ux * 6, cy - ny * r * 1.1 + uy * 6], [cx + ux * 9, cy + uy * 9], [cx + nx * r * 1.1 + ux * 6, cy + ny * r * 1.1 + uy * 6]], false), alpha(RB.line, 0.6), o.lw * 0.8);
      }
      if (o.rust) {
        const R = mulberry(o.rust);
        for (let i = 0; i < 5; i++) {
          const u = 0.1 + R() * 0.75, v = (R() - 0.5) * 1.4;
          const cx = lerp(a[0], b[0], u) + nx * lerp(ra, rb, u) * v, cy = lerp(a[1], b[1], u) + ny * lerp(ra, rb, u) * v;
          fillP(g, taper([[cx, cy], [cx + 3, cy + 18 + R() * 30]], 5 + R() * 5, WF.tail), alpha(RB.rust, 0.45));
        }
      }
      if (o.after) o.after(g, { a, b, nx, ny, ux, uy, ra, rb });
    },
    line: RB.line, lw: o.lw,
  });
  return p;
}
function ball(ctx, x, y, r, o) {
  const p = shp([[x - r, y], [x - r * 0.7, y - r * 0.7], [x, y - r], [x + r * 0.7, y - r * 0.7], [x + r, y], [x + r * 0.7, y + r * 0.7], [x, y + r], [x - r * 0.7, y + r * 0.7]], true);
  cel(ctx, p, { base: o.base || RB.iron, shade: o.shade || RB.ironS, off: r * 0.32, rim: RRIM, rimW: o.rimW || 4, line: RB.line, lw: o.lw,
    after: g => { g.fillStyle = alpha('#ffffff', 0.18); g.beginPath(); g.ellipse(x - r * 0.35, y - r * 0.4, r * 0.32, r * 0.2, -0.6, 0, TAU); g.fill(); } });
  return p;
}
function rivet(ctx, x, y, r) {
  ctx.fillStyle = 'rgba(40,25,15,0.55)'; ctx.beginPath(); ctx.arc(x + r * 0.3, y + r * 0.35, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,210,0.65)'; ctx.beginPath(); ctx.arc(x - r * 0.15, y - r * 0.15, r * 0.75, 0, TAU); ctx.fill();
}
function mossClump(ctx, R, x, y, w, h, lw, flowers) {
  const pts = [];
  const n = 9;
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    pts.push([x - w / 2 + u * w, y - h * Math.pow(Math.sin(PI * u), 0.6) * (0.7 + R() * 0.5)]);
  }
  pts.push([x + w / 2 - 4, y + h * 0.25], [x, y + h * 0.4 + R() * 6], [x - w / 2 + 4, y + h * 0.2]);
  const p = shp(pts, true);
  cel(ctx, p, { base: RB.moss, shade: RB.mossS, off: h * 0.3, rim: 'rgba(230,240,150,0.7)', rimW: 3, line: alpha('#2c3a1a', 0.8), lw: lw * 0.8,
    after: g => { for (let i = 0; i < 6; i++) { g.fillStyle = alpha(RB.mossH, 0.7); g.beginPath(); g.arc(x - w * 0.35 + R() * w * 0.6, y - h * 0.4 * R(), 2 + R() * 4, 0, TAU); g.fill(); } } });
  // grass blades
  for (let i = 0; i < Math.round(w / 9); i++) {
    const bx = x - w / 2 + R() * w, by = y - h * 0.3 * R();
    const L = 10 + R() * h * 0.9;
    fillP(ctx, taper([[bx, by], [bx + 3 + (TIP.sway || 0) * 0.5, by - L * 0.5], [bx + 6 + (TIP.sway || 0), by - L]], 3, WF.tail), jit('#7fa848', R, 14, 1));
  }
  if (flowers) for (let i = 0; i < flowers; i++) {
    const fx = x - w * 0.4 + R() * w * 0.8, fy = y - h * (0.5 + R() * 0.7);
    const col = ['#fffaf0', '#f6dc5c', '#f3b3c3'][(R() * 3) | 0];
    strokeP(ctx, shp([[fx, fy + 14], [fx + (TIP.sway || 0) * 0.4, fy]], false), '#5f8a38', 2);
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * TAU + R() * 0.3;
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(fx + Math.cos(a) * 4.5 + (TIP.sway || 0) * 0.4, fy + Math.sin(a) * 4.5, 4, 2.6, a, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#e8a83a'; ctx.beginPath(); ctx.arc(fx + (TIP.sway || 0) * 0.4, fy, 2.6, 0, TAU); ctx.fill();
  }
}

/* ---------- main draw ---------- */
function rlinePx() { return 1.7 * Math.pow(CAM.z * 1.0, 0.6); }
function drawRobot(ctx, P) {
  const WT = ctx.getTransform();
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.scale(P.s, P.s);
  const lw = rlinePx() / (CAM.z * P.s);
  boilReset(P.seed * 53 + 11, 0.5 / Math.max(0.5, Math.pow(CAM.z * P.s, 0.5)));
  const S = rSkel(P);
  S.lw = lw; S.WT = WT;
  if (P.shadow) {
    const g = ctx.createRadialGradient(0, 10, 20, 0, 10, 330);
    g.addColorStop(0, `rgba(30,40,20,${0.42 * P.shadow})`); g.addColorStop(1, 'rgba(30,40,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(40, 14, 330, 60, 0, 0, TAU); ctx.fill();
  }
  const backView = S.c < -0.05;
  if (!backView) drawMill(ctx, P, S, lw);
  const near = S.sp > 0.06 ? 'L' : S.sp < -0.06 ? 'R' : null;
  const far = near === 'L' ? 'R' : near === 'R' ? 'L' : null;
  if (far && !P['arm' + far].front) drawRArm(ctx, P, S, far, lw);
  const standing = S.st > 0.55;
  const legs = [S.lL, S.lR].sort((a, b) => a.z - b.z);
  if (standing) for (const l of legs) drawRLeg(ctx, P, S, l, lw);
  drawTorsoR(ctx, P, S, lw);
  if (!standing) { drawPelvis(ctx, P, S, lw); for (const l of legs) drawRLeg(ctx, P, S, l, lw); }
  else drawPelvis(ctx, P, S, lw);
  drawNeckR(ctx, P, S, lw);
  drawHeadR(ctx, P, S, lw);
  if (far && P['arm' + far].front) drawRArm(ctx, P, S, far, lw);
  if (near) drawRArm(ctx, P, S, near, lw); else { drawRArm(ctx, P, S, 'L', lw); drawRArm(ctx, P, S, 'R', lw); }
  if (backView) drawMill(ctx, P, S, lw);
  if (P.after) { ctx.save(); ctx.setTransform(WT); P.after(ctx, S); ctx.restore(); }
  ctx.restore();
  return S;
}
function robotWorld(P, p) { return [P.x + p[0] * P.s, P.y + p[1] * P.s]; }

/* windmill on the back */
function drawMill(ctx, P, S, lw) {
  const hub = S.T(-S.sp * 66, -470 + (P.slump || 0) * 30);
  const c = S.c;
  const kx = Math.max(0.06, Math.abs(c));
  // mast
  const mb = S.T(-S.sp * 50, -330);
  tube(ctx, mb, hub, 16, 14, { base: RB.wood, shade: RB.woodS, lw, off: 6 });
  const a0 = P.mill.a;
  for (let k = 0; k < 4; k++) {
    const a = a0 + (k * PI) / 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const P0 = (r, o) => [hub[0] + (ca * r - sa * o) * kx * Math.sign(c || 1), hub[1] + (sa * r + ca * o)];
    // canvas sail on one side of the spar
    const sail = shp([P0(80, 10), P0(540, 10), P0(540, 142), P0(130, 116)], true);
    cel(ctx, sail, {
      base: RB.canvas, shade: RB.canvasS, off: 10, rim: RRIM, rimW: 4, line: RB.line, lw,
      after: g => {
        for (let r = 160; r < 540; r += 64) strokeP(g, shp([P0(r, 10), P0(r, 136)], false), alpha(RB.wood, 0.8), lw * 1.7);
        for (const o of [52, 96]) strokeP(g, shp([P0(110, o), P0(540, o)], false), alpha(RB.wood, 0.55), lw * 1.2);
        // weathering stains
        const R = mulberry(77 + k);
        for (let i = 0; i < 5; i++) { const p = P0(160 + R() * 340, 24 + R() * 100); g.fillStyle = 'rgba(150,120,80,0.18)'; g.beginPath(); g.arc(p[0], p[1], 10 + R() * 20, 0, TAU); g.fill(); }
      },
    });
    // spar
    const sp = shp([P0(0, -10), P0(566, -8), P0(566, 10), P0(0, 10)], true);
    cel(ctx, sp, { base: RB.wood, shade: RB.woodS, off: 4, line: RB.line, lw });
  }
  if (P.mill.blur > 0) {
    ctx.save(); ctx.globalAlpha = P.mill.blur * 0.2;
    ctx.strokeStyle = 'rgba(255,248,230,0.8)'; ctx.lineWidth = 60;
    ctx.beginPath(); ctx.ellipse(hub[0], hub[1], 400 * kx, 400, 0, a0 - 0.7, a0); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(hub[0], hub[1], 400 * kx, 400, 0, a0 + PI - 0.7, a0 + PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(hub[0], hub[1], 400 * kx, 400, 0, a0 + PI / 2 - 0.7, a0 + PI / 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(hub[0], hub[1], 400 * kx, 400, 0, a0 - PI / 2 - 0.7, a0 - PI / 2); ctx.stroke();
    ctx.restore();
  }
  ball(ctx, hub[0], hub[1], 32, { base: RB.brass, shade: RB.brassS, lw });
  rivet(ctx, hub[0], hub[1], 6);
}

/* torso barrel */
function drawTorsoR(ctx, P, S, lw) {
  const { T, phi, c, sp } = S;
  const prof = [[-8, 172], [-60, 200], [-140, 214], [-230, 210], [-300, 196], [-350, 168], [-380, 120], [-396, 50]];
  const L = [], Rr = [];
  for (const [y, w] of prof) { L.push(T(-w, y)); Rr.push(T(w, y)); }
  const pts = [T(-150, 6), ...L, T(0, -404), ...Rr.reverse(), T(150, 6)];
  const body = shp(pts, true);
  const proj = (th, y, r) => { const a = th + phi; return { x: Math.sin(a) * r, v: Math.cos(a), p: T(Math.sin(a) * r, y) }; };
  const widthAt = y => { let w = 172; for (let i = 0; i < prof.length - 1; i++) if (y <= prof[i][0] && y >= prof[i + 1][0]) w = lerp(prof[i][1], prof[i + 1][1], (y - prof[i][0]) / (prof[i + 1][0] - prof[i][0])); return w; };
  cel(ctx, body, {
    base: RB.enamel, shade: RB.enamelS, off: 30, kx: 1.3, rim: RRIM, rimW: 6, line: RB.line, lw: lw * 1.15,
    after: g => {
      // lower iron belly band
      const b0 = T(-260, -10), b1 = T(260, -10), b2 = T(260, -70), b3 = T(-260, -70);
      g.fillStyle = RB.iron; g.beginPath(); g.moveTo(b0[0], b0[1]); g.lineTo(b1[0], b1[1]); g.lineTo(b2[0], b2[1]); g.quadraticCurveTo(T(0, -58)[0], T(0, -58)[1], b3[0], b3[1]); g.closePath(); g.fill();
      g.fillStyle = alpha(RB.ironS, 0.7); g.beginPath(); g.moveTo(b1[0], b1[1]); g.lineTo(b2[0], b2[1]); g.lineTo(T(120, -64)[0], T(120, -64)[1]); g.lineTo(T(120, -10)[0], T(120, -10)[1]); g.fill();
      // horizontal seams with rivets
      for (const y of [-72, -175, -290]) {
        const w = widthAt(y);
        const seam = [];
        for (let i = 0; i <= 16; i++) { const th = -PI / 2 + (PI * i) / 16; const pp = proj(th - phi, y + Math.cos(th) * 8, w); seam.push(T(Math.sin(th) * w, y + Math.cos(th) * 10)); }
        strokeP(g, shp(seam, false), alpha(RB.line, 0.55), lw);
        for (let i = 0; i < 14; i++) {
          const th = -PI / 2 + 0.2 + (PI - 0.4) * (i / 13);
          const q = T(Math.sin(th) * w * 0.98, y + Math.cos(th) * 10 + 9);
          rivet(g, q[0], q[1], 3.4 * Math.max(0.4, Math.cos(th)));
        }
      }
      // vertical plate seams (projected)
      for (const th of [-0.75, 0.75, 2.2, -2.2]) {
        const a = th + phi; if (Math.cos(a) < 0.08) continue;
        const pts2 = [];
        for (let y = -80; y > -290; y -= 30) pts2.push(T(Math.sin(a) * widthAt(y), y));
        strokeP(g, shp(pts2, false), alpha(RB.line, 0.5), lw * 0.9);
      }
      // rust streaks from rivets (fixed seeds)
      const R = mulberry(901);
      for (let i = 0; i < 26; i++) {
        const th = (R() - 0.5) * PI * 1.6, y = -90 - R() * 260;
        const a = th + phi; const v = Math.cos(a); if (v < 0.15) continue;
        const x = Math.sin(a) * widthAt(y) * 0.97;
        const q = T(x, y), q2 = T(x + 2, y + 30 + R() * 70);
        fillP(g, taper([q, q2], (4 + R() * 7) * v, WF.tail), alpha(RB.rust, 0.35 + R() * 0.25));
      }
      // chipped enamel patches showing iron
      for (let i = 0; i < 9; i++) {
        const th = (R() - 0.5) * PI * 1.5, y = -100 - R() * 240;
        const a = th + phi; const v = Math.cos(a); if (v < 0.2) continue;
        const q = T(Math.sin(a) * widthAt(y) * 0.95, y);
        const r = (6 + R() * 12);
        g.fillStyle = alpha(RB.ironS, 0.75);
        g.beginPath(); g.ellipse(q[0], q[1], r * v, r * 0.7, R(), 0, TAU); g.fill();
        g.fillStyle = alpha(RB.rust, 0.55); g.beginPath(); g.ellipse(q[0] + 2, q[1] + r * 0.5, r * v * 0.7, r * 0.3, 0, 0, TAU); g.fill();
      }
      // faded painted emblem: wind swirl
      { const a = -0.5 + phi; const v = Math.cos(a);
        if (v > 0.2) { const q = T(Math.sin(a) * 196, -230); g.save(); g.translate(q[0], q[1]); g.scale(v, 1); g.strokeStyle = 'rgba(70,110,130,0.45)'; g.lineWidth = 7; g.lineCap = 'round';
          g.beginPath(); g.arc(0, 0, 26, PI * 0.2, PI * 1.6); g.stroke(); g.beginPath(); g.arc(8, -4, 12, PI * 1.0, PI * 2.2); g.stroke(); g.beginPath(); g.moveTo(-40, 30); g.quadraticCurveTo(0, 18, 36, 34); g.stroke(); g.restore(); } }
      // chest porthole
      { const a = phi; const v = Math.cos(a);
        if (v > 0.12) {

/* ---------- wind ---------- */
const GUSTS = [];  // {t0, x0, v, w, a}
function windAt(x, t) {
  let b = Math.sin(t * 1.3 + x * 0.004) * 0.06 + Math.sin(t * 2.7 + x * 0.011) * 0.03;
  for (const g of GUSTS) {
    if (t < g.t0) continue;
    const c = g.x0 + g.v * (t - g.t0);
    const d = (x - c) / g.w;
    b += Math.exp(-d * d) * g.a + (x < c ? g.trail || 0 : 0) * Math.exp(-Math.max(0, (c - x) / (g.w * 4)));
  }
  return b;
}
/* foreground grass in screen space; band from y0 to y1 */
let GRASS = null;
function grassBlades() {
  const R = mulberry(8080);
  const out = [];
  for (let i = 0; i < 520; i++) {
    const d = R();
    out.push({ x: R() * (W + 200) - 100, d, h: 60 + d * 220 + R() * 60, w: 6 + d * 12, ph: R() * TAU, col: R(), fl: R() < 0.08 ? ['#fffaf0', '#f6dc5c', '#f3b3c3'][(R() * 3) | 0] : null, lean: 0.08 + R() * 0.12 });
  }
  out.sort((a, b) => a.d - b.d);
  return out;
}
function drawGrassFG(ctx, t, y0, y1, k, scrollX) {
  if (!GRASS) GRASS = grassBlades();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sx = scrollX || 0;
  for (const b of GRASS) {
    const x = ((b.x - sx * (0.6 + b.d * 0.6)) % (W + 200) + W + 200) % (W + 200) - 100;
    const by = lerp(y0, y1, b.d) + 40;
    const h = b.h * (k || 1);
    const wind = windAt(x + sx, t);
    const bend = b.lean + wind * (0.9 + b.d * 0.5) + Math.sin(t * 5 + b.ph) * 0.04 * (1 + wind * 3);
    const tipx = x + Math.sin(bend) * h, tipy = by - Math.cos(bend) * h;
    const midx = x + Math.sin(bend * 0.45) * h * 0.55, midy = by - Math.cos(bend * 0.45) * h * 0.55;
    const lit = clamp(wind * 1.6, 0, 1);
    const base = b.d < 0.5 ? mixc('#4d7a3a', '#7fae4c', b.col) : mixc('#5f8f40', '#9cc25a', b.col);
    const col = lit > 0.05 ? mixc(base.length > 7 ? '#7fae4c' : '#7fae4c', '#d8e79a', lit * 0.7) : base;
    const p = taper([[x, by], [midx, midy], [tipx, tipy]], b.w, u => Math.pow(1 - u, 0.8) * 1.0 + 0.05, 5);
    ctx.fillStyle = lit > 0.05 ? mixc('#6f9f46', '#d6e594', lit * 0.75 * (0.5 + b.col * 0.5)) : base;
    ctx.fill(p);
    if (b.d > 0.55) { ctx.strokeStyle = 'rgba(30,50,20,0.35)'; ctx.lineWidth = 1.2; ctx.stroke(p); }
    if (b.fl) {
      const fr = 4 + b.d * 7;
      for (let q = 0; q < 5; q++) { const a = (q / 5) * TAU + b.ph; ctx.fillStyle = b.fl; ctx.beginPath(); ctx.ellipse(tipx + Math.cos(a) * fr * 0.8, tipy + Math.sin(a) * fr * 0.8, fr * 0.7, fr * 0.45, a, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#e8a83a'; ctx.beginPath(); ctx.arc(tipx, tipy, fr * 0.45, 0, TAU); ctx.fill();
    }

}
/* petals & dandelion seeds streaming in screen space */
function drawFlyers(ctx, t, t0, n, seed, dens) {
  if (t < t0) return;
  const R = mulberry(seed);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < n; i++) {
    const st = t0 + R() * 3.5, x0 = -200 - R() * 600, y0 = H * (0.15 + R() * 0.8);
    const sp = 380 + R() * 420, kind = R() < 0.55 ? 'petal' : 'seed', ph = R() * TAU, sz = 0.6 + R() * 0.9;

    if (tt < 0) continue;
    const x = x0 + sp * tt, y = y0 - tt * (60 + R() * 60) + Math.sin(tt * 2.4 + ph) * 40;

      ctx.scale(1, Math.abs(Math.sin(tt * 4 + ph)) * 0.8 + 0.2);
      ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, 9 * sz, 5 * sz, 0, 0, TAU); ctx.fill();

      for (let k = 0; k < 9; k++) { const a = (k / 9) * TAU + tt; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 9 * sz, y + Math.sin(a) * 9 * sz); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(160,140,110,0.8)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 3, y + 12 * sz); ctx.stroke();

}
/* Ghibli-style white wind lines */
function drawWindLines(ctx, t, t0, n, a, seed, yA, yB) {
  if (t < t0 || a <= 0) return;

  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.lineCap = 'round';

    const st = t0 + R() * 2.5, y = lerp(yA === undefined ? 0 : yA, yB === undefined ? H : yB, R()), len = 300 + R() * 500, sp = 900 + R() * 700, amp = 20 + R() * 40, ph = R() * TAU;

    const pts = [];
    for (let k = 0; k <= 12; k++) { const x = head - len * (k / 12); pts.push([x, y + Math.sin(x * 0.006 + ph) * amp]); }
    const life = clamp(1 - (head - W * 0.5) / (W * 1.2), 0, 1);
    ctx.fillStyle = `rgba(255,255,255,${a * (0.25 + R() * 0.25) * life})`;
    ctx.fill(taper(pts.map(p => [p[0], p[1]]), 3 + R() * 3, WF.both, 3));

}
/* soil clods & grass bits falling (world space) */
function drawSoil(ctx, t, t0, src, n, seed, s) {

    const p = src[(R() * src.length) | 0];
    const st = t0 + R() * 2.2, tt = t - st;
    const vx = (R() - 0.5) * 140, vy = -40 - R() * 80;
    if (tt < 0 || tt > 2.2) continue;
    const x = p[0] + (R() - 0.5) * 120 * s + vx * tt * s, y = p[1] + (R() - 0.5) * 60 * s + (vy * tt + 0.5 * 900 * tt * tt) * s;
    const grass = R() < 0.4;
    ctx.save(); ctx.translate(x, y); ctx.rotate(tt * 6 * (R() - 0.5));
    if (grass) { ctx.strokeStyle = '#6f9a40'; ctx.lineWidth = 3 * s; ctx.beginPath(); ctx.moveTo(-8 * s, 0); ctx.lineTo(0, -12 * s); ctx.lineTo(6 * s, 2 * s); ctx.stroke(); }
    else { ctx.fillStyle = R() < 0.5 ? '#6a4a2e' : '#8a6440'; const r = (5 + R() * 9) * s; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.8, 0, 0, TAU); ctx.fill(); }

/* dust puff cloud (world) */
function drawDust(ctx, x, y, s, t, seed) {

    const a = PI + R() * PI, d = s * (0.3 + t * 1.4) * (0.5 + R() * 0.6);

/* light rays from upper left (screen) */

/* ============================================================
   SHOTS — "바람지기" (The Wind Keeper), 30 seconds
   ============================================================ */
const SHAKE = { x: 0, y: 0 };
function camSet(ctx, x, y, z) {
  CAM.x = x; CAM.y = y; CAM.z = z;
  ctx.setTransform(z, 0, 0, z, W / 2 - x * z + SHAKE.x, H / 2 - y * z + SHAKE.y);
}
function shake(T, t0, amp, dur, f) {
  const u = T - t0; if (u < 0 || u > dur) return;
  const k = (1 - u / dur) * amp;
  SHAKE.x += Math.sin(u * (f || 60)) * k; SHAKE.y += Math.cos(u * (f || 60) * 0.83) * k;
}
/* ---- global timeline (absolute time) ---- */
GUSTS.push({ t0: 4.4, x0: -500, v: 950, w: 300, a: 0.6, trail: 0.16 });
GUSTS.push({ t0: 8.6, x0: -600, v: 1100, w: 260, a: 0.35, trail: 0.12 });
GUSTS.push({ t0: 18.8, x0: -600, v: 1000, w: 320, a: 0.5, trail: 0.22 });
const TL = {
  slump: T => K(T, [[13.2, 1], [14.8, 0.3, 'io2'], [19.4, 0.25], [20.6, 0, 'io2']]),
  sit: T => K(T, [[19.7, 1], [22.7, 0, 'io3']]),
  omega: T => K(T, [[6.5, 0], [8.0, 0.8, 'i2'], [10.0, 2.0, 'io2'], [19.5, 2.0], [22.5, 2.8, 'io2']]),
  open: T => { if (T < 11.0) return 0; const u = clamp((T - 11.0) / 1.25, 0, 1); const steps = Math.floor(u * 5) / 5; return E.o3(Math.min(1, steps + (u * 5 % 1) * 0.08)); },
  glow: T => {
    if (T < 10.95) return 0;
    if (T < 11.7) { const f = Math.floor((T - 10.95) * 24); return [0.2, 0, 0.45, 0.1, 0.6, 0.2, 0.75, 0.4, 0.8, 0.5, 0.9, 0.7, 0.95, 0.8, 1, 0.85, 1, 0.9][f % 18] * 0.85; }
    return clamp(lerp(0.85, 1, (T - 11.7) / 0.7), 0, 1) * (1 + Math.sin(T * 3) * 0.04);
  },
  chest: T => K(T, [[9.2, 0], [11.8, 0.85, 'io2']]),

const MILL = [];
(function () { let a = 0.35; for (let i = 0; i <= DUR * 240; i++) { MILL.push(a); a += TL.omega(i / 240) / 240; } })();
const millA = T => MILL[clamp(Math.round(T * 240), 0, MILL.length - 1)];

/* ---- robot in hilltop world ---- */
const RX = 0, RY = 62;
function baseRobot(T, pt) {
  const P = newRobot();
  P.x = RX; P.y = RY; P.s = 1; P.yaw = -0.34;
  P.sit = TL.sit(T); P.slump = TL.slump(T);
  P.mill.a = millA(T); P.mill.blur = clamp((TL.omega(T) - 1.2) / 1.2, 0, 1);
  P.eye.open = TL.open(T); P.eye.glow = TL.glow(T);
  P.glowChest = TL.chest(T);
  P.sway = windAt(700, T) * 16;
  P.vane = T < 4.6 ? 1.2 : lerp(1.2, 0.05, clamp((T - 4.6) / 0.8, 0, 1)) + Math.sin(T * 7) * 0.08 * (T > 4.6 ? 1 : 0);
  P.seed = Math.floor(pt * 12) + Math.floor(T);

  P.armL = { x: -318, y: -22, hand: 'push', bend: 1, rot: 1.75 };
  P.armR = { x: 222, y: -8, hand: 'push', bend: -1, front: true, rot: 1.45 };

}
function headWorld(P) { const S = rSkel(P); return robotWorld(P, S.head); }
/* a point on the robot's hood (top of eye visor) in world coords */
function hoodWorld(P, dx, dy) {
  const S = rSkel(P);

  const ex = Math.sin(S.headYaw) * RH * 0.92;

let GRAIN = null;
function makeGrain() {

    const c = mk(256, 256), g = c.getContext('2d');
    const id = g.createImageData(256, 256);
    const R = mulberry(k * 999 + 1);
    for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (R() - 0.5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0);

  }
}
function render(ctx, tIn) {
  const f = Math.min(Math.floor(tIn * FPS + 1e-6), DUR * FPS - 1);
  const T = f / FPS;
  let sh = SHOTS[SHOTS.length - 1];
  for (const s of SHOTS) if (T >= s.t0 && T < s.t1) { sh = s; break; }
  const lt = T - sh.t0;

}
function post(ctx, T, f) {

  const wg = ctx.createLinearGradient(0, 0, W, H);

  ctx.globalCompositeOperation = 'multiply';
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, H * 1.1);
  vg.addColorStop(0, 'rgba(255,255,255,1)'); vg.addColorStop(1, 'rgba(170,150,135,1)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (GRAIN) {
    ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.06;

}

  const prog = parts.map(() => 0);
  const bufs = await Promise.all(parts.map(([a, b], k) => renderChunk(OAC, a, b, b >= DUR, f => { prog[k] = f; if (onProgress) onProgress(prog.reduce((x, y) => x + y, 0) / parts.length); })));

  const out = new AB({ length: len, numberOfChannels: 2, sampleRate: ASR });

  parts.forEach(([a], k) => {
    const off = Math.round(a * ASR);
    for (let ch = 0; ch < 2; ch++) {
      const d = bufs[k].getChannelData(ch), o = L[ch];
      const n = Math.min(d.length, len - off);
      for (let i = 0; i < n; i++) o[off + i] += d[i];

  mel1.forEach(([t, n, d]) => flute(t, hz(n), d, 0.16, -0.1));
  [[14.0, ['F2', 'C3', 'A3']], [15.25, ['A2', 'E3', 'C4']], [16.5, ['D3', 'A3', 'F4']], [17.75, ['Bb2', 'F3', 'D4']]].forEach(([t, ns]) => ns.forEach((n, i) => piano(t + i * 0.12, hz(n), 0.09, 2.2, 0.25)));
  // S6 rise — strings swell, timpani on the pushes
  pad(18.9, 1.6, ['Bb2', 'F3', 'D4', 'F4'], 0.18, 1000);
  pad(20.4, 1.4, ['C3', 'G3', 'E4', 'G4'], 0.2, 1400);
  pad(21.7, 2.4, ['D3', 'A3', 'F4', 'A4'], 0.22, 1800);
  timp(19.9, 55, 0.5); timp(21.0, 58, 0.55); timp(22.5, 65, 0.55); timp(23.5, 87, 0.4);
  arp(20.3, 24.0, [['C4', 'E4', 'G4', 'C5'], ['D4', 'F4', 'A4', 'D5']], () => 0.15, 0.22);
  // S7 walking away — full theme
  pad(23.9, 2.1, ['F3', 'C4', 'A4', 'C5'], 0.2, 2000);
  pad(26.0, 1.5, ['D3', 'A3', 'F4', 'A4'], 0.2, 2000);
  pad(27.5, 1.2, ['Bb2', 'F3', 'D4', 'F4'], 0.2, 2000);
  pad(28.7, 1.2, ['F2', 'C3', 'A3', 'F4'], 0.22, 1600);
  const mel2 = [[24.0, 'A4', 0.4], [24.4, 'C5', 0.4], [24.8, 'F5', 0.75], [25.6, 'E5', 0.35], [26.0, 'D5', 0.4], [26.4, 'C5', 0.4], [26.8, 'A4', 0.6], [27.5, 'Bb4', 0.35], [27.85, 'D5', 0.35], [28.2, 'C5', 0.45], [28.7, 'F5', 1.2]];
  mel2.forEach(([t, n, d]) => { flute(t, hz(n), d, 0.17, 0); flute(t, hz(n) / 2, d, 0.06, 0.2); });
  arp(24.0, 29.6, [['F3', 'C4', 'F4', 'A4'], ['A3', 'C4', 'E4', 'A4'], ['D3', 'A3', 'D4', 'F4'], ['Bb2', 'F3', 'Bb3', 'D4']], () => 0.2, 0.2);
  [[24.0, 'F2'], [26.0, 'D2'], [27.5, 'Bb1'], [28.7, 'F2']].forEach(([t, n]) => piano(t, hz(n), 0.18, 2.5, 0));
  glock(28.7, hz('A6'), 0.05); glock(29.0, hz('C7'), 0.04);
  if (last) { master.gain.setValueAtTime(0.75, T(29.0)); master.gain.linearRampToValueAtTime(0.0, T(29.98)); }
  const span = C1 - C0 + TAIL;
  for (let q = 0.5; q < span; q += 0.5) {
    ac.suspend(q).then(() => {
      for (let i = live.length - 1; i >= 0; i--) if (live[i][1] - C0 < q) { try { live[i][0].disconnect(); } catch (e) { } live.splice(i, 1); }
      if (onProg) onProg(q / span);
      ac.resume();
    });
  }
  return await ac.startRendering();
}

/* ============================================================
   PLAYER
   ============================================================ */
(function () {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const still = params.has('t');
  let t = 0, playing = false, lastFrame = -1, clock0 = 0, offset0 = 0, ac = null, src = null, gainN = null, ended = false;
  const fmt = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}.${String(Math.floor((s % 1) * 10))}`; };
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  function draw(tt) { const f = Math.floor(tt * FPS + 1e-6); if (f === lastFrame) return; lastFrame = f; render(ctx, tt); }
  function status(s) { $('status').textContent = s; }
  function now() { return ac && SND.buffer ? ac.currentTime : performance.now() / 1000; }
  function startAudio(at) {
    if (!SND.buffer) return;
    if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; ac = new AC(); gainN = ac.createGain(); gainN.connect(ac.destination); }
    if (ac.state === 'suspended') ac.resume();
    gainN.gain.value = SND.muted ? 0 : 1;
    src = ac.createBufferSource(); src.buffer = SND.buffer; src.connect(gainN);
    src.start(0, Math.min(at, SND.buffer.duration - 0.01));
  }
  function stopAudio() { if (src) { try { src.stop(); } catch (e) { } src.disconnect(); src = null; } }
  function play() {
    if (ended || t >= DUR - 1 / FPS) { t = 0; ended = false; }
    startAudio(t);
    clock0 = now(); offset0 = t; playing = true;
    document.body.classList.add('playing'); document.body.classList.remove('ended');
    $('cover').classList.add('hide'); $('pp').textContent = '❚❚'; $('pp').setAttribute('aria-label', '일시정지');
    poke();
  }
  function pause() {
    if (!playing) return;
    t = offset0 + (now() - clock0); playing = false; stopAudio();
    document.body.classList.remove('playing'); $('pp').textContent = '▶'; $('pp').setAttribute('aria-label', '재생');
  }
  function seek(tt) {
    t = clamp(tt, 0, DUR - 1 / FPS); ended = false;
    if (playing) { stopAudio(); startAudio(t); clock0 = now(); offset0 = t; }
    lastFrame = -1; draw(t); ui();
  }
  function ui() {
    $('bar').value = String(Math.round((t / DUR) * 1000));
    $('time').textContent = `${fmt(t)} / ${fmt(DUR)}`;
  }
  function loop() {
    if (playing) {
      t = offset0 + (now() - clock0);
      if (t >= DUR) { t = DUR - 1 / FPS; pause(); ended = true; document.body.classList.add('ended'); $('cover').classList.remove('hide'); $('go').textContent = '↺ 다시 보기'; }
      draw(t); ui();
    }
    requestAnimationFrame(loop);
  }
  let hideT = 0;
  function poke() { document.body.classList.add('ui-on'); clearTimeout(hideT); hideT = setTimeout(() => { if (playing) document.body.classList.remove('ui-on'); }, 2200); }
  async function init() {
    status('배경을 그리는 중…');
    await nextFrame();
    paintLand(); makeGrain();
    lastFrame = -1; draw(still ? +params.get('t') : 16.9);
    if (still) { document.body.classList.add('still'); window.__ready = true; return; }
    status('음악과 효과음을 만드는 중…');
    await nextFrame();
    try { SND.buffer = await buildAudio(f => { const pc = Math.round(f * 100); status(`음악과 효과음을 만드는 중… ${pc}%`); $('go').textContent = `준비 중… ${pc}%`; }); } catch (e) { console.warn('audio unavailable', e); SND.buffer = null; }
    status(SND.buffer ? '소리를 켜고 감상하세요' : '이 브라우저에서는 소리 없이 재생됩니다');
    $('go').disabled = false; $('go').textContent = '▶ 재생';
    window.__ready = true;
  }
  $('go').addEventListener('click', () => { if (!$('go').disabled) { lastFrame = -1; play(); } });
  $('pp').addEventListener('click', () => (playing ? pause() : play()));
  $('rs').addEventListener('click', () => { seek(0); if (!playing) play(); });
  $('mu').addEventListener('click', () => { SND.muted = !SND.muted; if (gainN) gainN.gain.value = SND.muted ? 0 : 1; $('mu').textContent = SND.muted ? '🔇' : '🔊'; });
  $('fs').addEventListener('click', () => { const el = document.documentElement; if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (() => { })).call(el); else document.exitFullscreen(); });
  $('bar').addEventListener('input', e => seek((+e.target.value / 1000) * DUR));
  document.addEventListener('mousemove', poke); document.addEventListener('touchstart', poke, { passive: true });
  document.addEventListener('keydown', e => {
    if ($('go').disabled) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === 'ArrowRight') { pause(); seek(t + 1 / FPS); }
    else if (e.code === 'ArrowLeft') { pause(); seek(t - 1 / FPS); }
    else if (e.key === 'r' || e.key === 'R') { seek(0); if (!playing) play(); }
    else if (e.key === 'm' || e.key === 'M') $('mu').click();
    else if (e.key === 'f' || e.key === 'F') $('fs').click();
    poke();
  });
  window.__renderAt = tt => { pause(); seek(tt); return true; };
  requestAnimationFrame(loop);
  init();
})();

</script>
