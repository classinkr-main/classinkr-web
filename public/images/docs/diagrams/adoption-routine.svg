<text class="h" x="340" y="182" text-anchor="middle">전자칠판 판서</text>
<text class="s" x="340" y="218" text-anchor="middle">실시간 수업은 판서 중심</text>
<circle cx="972" cy="132" r="17" fill="#FFF" stroke="#084734" stroke-width="3"/>
<text class="n" x="972" y="139" text-anchor="middle">2</text>
<text class="h" x="1100" y="182" text-anchor="middle">수업 녹화</text>
<text class="s" x="1100" y="218" text-anchor="middle">자동 녹화 상태 점검</text>
<circle cx="972" cy="482" r="17" fill="#FFF" stroke="#084734" stroke-width="3"/>
<text class="n" x="972" y="489" text-anchor="middle">3</text>
<text class="h" x="1100" y="532" text-anchor="middle">다시보기 복습</text>
<text class="s" x="1100" y="568" text-anchor="middle">결석·복습 학생에게 배포</text>
<circle cx="212" cy="482" r="17" fill="#FFF" stroke="#084734" stroke-width="3"/>
<text class="n" x="212" y="489" text-anchor="middle">4</text>
<text class="h" x="340" y="532" text-anchor="middle">LMS 숙제·시험</text>
