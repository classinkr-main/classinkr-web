<svg viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="판서, 녹화, 다시보기 복습, LMS 숙제·시험으로 이어져 다시 판서로 돌아오는 수업 운영 루틴 루프">
<style>
text{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.h{font-size:28px;fill:#111110;font-weight:600}
.s{font-size:20px;fill:#615D59}
.n{font-size:20px;fill:#084734;font-weight:700}
.box{fill:#FFF;stroke:rgba(0,0,0,0.08);stroke-width:1.5}
.ln{fill:none;stroke:#31302E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ah{fill:#084734}
</style>
<g transform="translate(0,30)">
<rect class="box" x="170" y="90" width="340" height="170" rx="16"/>
<rect class="box" x="930" y="90" width="340" height="170" rx="16"/>
<rect class="box" x="930" y="440" width="340" height="170" rx="16"/>
<rect class="box" x="170" y="440" width="340" height="170" rx="16"/>
<circle cx="212" cy="132" r="17" fill="#FFF" stroke="#084734" stroke-width="3"/>
