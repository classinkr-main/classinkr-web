<script>/* big screens (2026-10-27): above 1920 x 1000 the page scales up as a whole, so a 2560 monitor or a 4K TV shows the
   1920 layout larger instead of a narrow column; viewport units divide by --zoom (vite.config.js bigScreenUnits) */
(function () {
  var d = document.documentElement;
  function fit() {
    var z = Math.min(innerWidth / 1920, innerHeight / 1000);
    z = z > 1.04 ? Math.round(z * 100) / 100 : 1;
    d.style.zoom = z > 1 ? z : '';
    d.style.setProperty('--zoom', z);
  }
  fit();
  addEventListener('resize', fit);
})();</script>
