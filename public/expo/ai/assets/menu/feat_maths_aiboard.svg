<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368 232">
  <!-- Card art for the AI Sketch Board feature, drawn to sit with the mockup
       illustrations: soft mint blob, the product's own AI小黑板 board, a
       marked answer card floating in front. -->
  <defs>
    <radialGradient id="blob" cx="50%" cy="52%" r="50%">
      <stop offset="0" stop-color="#dff3e7"/><stop offset=".72" stop-color="#e9f7ef"/><stop offset="1" stop-color="#f4fbf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e3cb"/><stop offset="1" stop-color="#c49a66"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6a58"/><stop offset="1" stop-color="#173e33"/></linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2cc281"/><stop offset="1" stop-color="#0c9a61"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1c4a36" flood-opacity=".22"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1c4a36" flood-opacity=".20"/></filter>
  </defs>
  <ellipse cx="184" cy="122" rx="118" ry="104" fill="url(#blob)"/>
  <circle cx="58" cy="92" r="9" fill="#d6efe0"/><circle cx="318" cy="150" r="12" fill="#ddf2e5"/><circle cx="300" cy="70" r="5" fill="#cfeadb"/>
  <path d="M62 60l-8-10M74 54l-2-12M50 72l-12-4" stroke="#1db56f" stroke-width="4" stroke-linecap="round"/>

  <!-- the board -->
  <g filter="url(#sh)">
    <rect x="86" y="46" width="186" height="124" rx="14" fill="url(#wood)"/>
    <rect x="96" y="56" width="166" height="104" rx="8" fill="url(#slate)"/>
    <rect x="118" y="172" width="122" height="7" rx="3.5" fill="#b08556"/>
  </g>
  <text x="112" y="92" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="26" fill="#c9f8e9">AI</text>
  <g fill="none" stroke="#eaf6f1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M114 120v-16h7a4.5 4.5 0 0 1 0 9h-7M121 113l5 7"/>
    <path d="M134 108h8M134 115h8"/>
    <path d="M150 99v7a4 4 0 0 0 8 0v-7M161 97q3-3 5 0t-4 5h5"/>
    <path d="M147 118h22"/>
    <path d="M154 137V124h5a3.5 3.5 0 0 1 0 7h-5"/>
  </g>

  <!-- the marked answer card -->
  <g filter="url(#sh2)">
    <rect x="214" y="112" width="112" height="84" rx="14" fill="#fff"/>
  </g>
  <rect x="228" y="126" width="36" height="7" rx="3.5" fill="#f0a24a"/>
  <rect x="228" y="143" width="62" height="6" rx="3" fill="#dfe8e3"/>
  <rect x="228" y="156" width="48" height="6" rx="3" fill="#dfe8e3"/>
  <circle cx="302" cy="170" r="15" fill="url(#grn)"/>
  <path d="M294 170l5.5 5.5 10-11" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="228" y="185" font-family="Gilroy,Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" fill="#1b2624">100</text>
</svg>
